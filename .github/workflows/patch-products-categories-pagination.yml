name: Patch Kzie admin controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-admin-controls]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply admin controls and checkout patch
        run: python scripts/patch_admin_controls.py
      - name: Commit patch
        run: |
          git config user.name "ChatGPT Update Bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "[auto-admin-controls] Add protected admin edits, checkout customer details, and payments"
            git push
          fi
