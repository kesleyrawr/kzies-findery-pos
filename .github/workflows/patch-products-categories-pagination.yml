name: Patch Kzie product UX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product UX patch
        run: python scripts/patch_product_ux.py
      - name: Commit patch
        run: |
          git config user.name "ChatGPT Update Bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "[auto-patch] Categorize products, show recent POS searches, add pagination"
            git push
          fi
