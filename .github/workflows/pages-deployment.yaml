name: Sync current Kzies build into GitHub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Sync current Cloudflare build'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download current live Kzies build
        run: |
          curl -fL --retry 3 --retry-delay 2 https://kzies-findery-pos.pages.dev/ -o index.html
          printf '/* /index.html 200\n' > _redirects

      - name: Commit current build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html _redirects
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync current Cloudflare build"
          git push
