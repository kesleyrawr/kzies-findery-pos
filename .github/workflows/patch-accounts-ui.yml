name: Sync Kzie products

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-products:
    if: ${{ !contains(github.event.head_commit.message, '[auto-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build products.csv from Kzie product feed
        shell: bash
        run: |
          curl -fsSL 'https://mffxrxjmznmchcametff.supabase.co/functions/v1/kzies-products' -o /tmp/products.json
          python - <<'PY'
          import csv, json
          from pathlib import Path
          data=json.loads(Path('/tmp/products.json').read_text(encoding='utf-8'))
          rows=data.get('products') or []
          if not rows:
              raise SystemExit('Product feed returned no products')
          with open('products.csv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f)
              w.writerow(['Brand','Product Name','Retail Price','Wholesale Price','Notes'])
              for x in rows:
                  retail='' if x.get('retail') is None else x.get('retail')
                  wholesale='' if x.get('wholesale') is None else x.get('wholesale')
                  w.writerow([x.get('brand',''),x.get('name',''),retail,wholesale,x.get('notes','')])
          print(f'Wrote {len(rows)} products')
          PY
          git config user.name "ChatGPT Update Bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- products.csv; then
            git add products.csv
            git commit -m "[auto-patch] Publish Kzie product catalog"
            git push
          fi
