name: Fix Kzie product loading

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-products:
    if: ${{ !contains(github.event.head_commit.message, '[auto-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch product loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('async function products(){')
          end = s.index('async function staff(){', start)
          new_products = '''async function products(){
           try{
            const {data,error}=await sb.rpc('kzies_get_cached_products');
            if(error) throw error;
            const rows=Array.isArray(data)?data:[];
            S.products=rows.map((x,i)=>{
             const retail=x.retail==null?null:Number(x.retail),wholesale=x.wholesale==null?null:Number(x.wholesale),selling=retail?Math.round(retail*1.3):null;
             return{id:x.id??i+1,brand:x.brand||'',name:x.name||'',retail,wholesale,notes:x.notes||'',selling,income:selling!=null&&wholesale!=null?selling-wholesale:null};
            }).filter(x=>x.name);
            if(!S.products.length) throw new Error('No products are available yet.');
           }catch(e){console.error('Unable to load products',e);S.products=[]}
          }
          '''
          s = s[:start] + new_products + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "ChatGPT Update Bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "[auto-patch] Load 432 cached products from Supabase"
            git push
          fi
