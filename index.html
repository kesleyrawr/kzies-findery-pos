async function profile(){const tok=localStorage.getItem(TOKEN_KEY)||'';if(!tok)return false;const {data,error}=await sb.rpc('kzies_session_local',{p_token:tok});if(error||!data?.ok){localStorage.removeItem(TOKEN_KEY);S.profile=null;return false}S.profile=data.profile;return true}
async function logoutLocal(){const tok=localStorage.getItem(TOKEN_KEY)||'';try{if(tok)await sb.rpc('kzies_logout_local',{p_token:tok})}catch{}localStorage.removeItem(TOKEN_KEY);S.profile=null;S.tab='POS';loginView()}
async function products(){try{const r=await fetch(`${SUPA}/functions/v1/kzies-products`),d=await r.json();S.products=d.products||[]}catch{S.products=[]}}

function cards(list){return `<div class="grid">${list.map(p=>`<article class="product"><div class="thumb">⌨️</div><div class="body"><div class="brandName">${esc(p.brand)}</div><h3>${esc(p.name)}</h3><div class="price">${p.selling?money(p.selling):'Contact us'}</div><div class="cost">Retail: ${p.retail?money(p.retail):'Contact us'}<br>Wholesale: ${p.wholesale?money(p.wholesale):'Contact us'}</div>${p.income!=null?`<div class="income">Income: ${money(p.income)}</div>`:''}<button data-add="${p.id}" ${!p.selling?'disabled':''}>Add to cart</button></div></article>`).join('')}</div>`}
function bindAdd(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=S.products.find(x=>x.id==b.dataset.add),q=S.cart.find(x=>x.id===p.id);q?q.qty++:S.cart.push({...p,qty:1});render()})}

tion.onclick=()=>{S.tab='Quotation';shell()};pay.onclick=()=>{const w=S.cart.reduce((a,p)=>a+(p.wholesale||0)*p.qty,0);S.sales.unshift({id:'#'+(1001+S.sales.length),customer:'Walk-in',time:new Date().toLocaleString('en-PH',{timeZone:'Asia/Manila'}),total,wholesale:w,income:total-w,items:structuredClone(S.cart)});S.cart=[];toast('Sale completed.');render()};return}if(t==='Products'){const list=(S.search?S.products.filter(p=>(p.name+' '+p.brand).toLowerCase().includes(S.search.toLowerCase())):S.products).slice(0,60);c.innerHTML=`<h2>Products</h2><p class="muted">Selling Price = Retail + 30%, rounded to the nearest peso. Income = Selling − Wholesale.</p><input id="q" class="search" value="${esc(S.search)}" placeholder="Search all products…"><div class="label">${S.products.length} PRODUCTS</div>${cards(list)}`;q.oninput=e=>{S.search=e.target.value;render()};bindAdd();return}if(t==='Quotation'){const total=S.cart.reduce((a,p)=>a+p.selling*p.qty,0);c.innerHTML=`<h2>Quotation</h2><div class="light" style="padding:18px">${S.cart.length?S.cart.map(x=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee"><span>${x.qty} × ${esc(x.name)}</span><b>${money(x.qty*x.selling)}</b></div>`).join(''):'No products in quotation.'}${S.cart.length?`<div class="total"><span>Total</span><span>${money(total)}</span></div><button onclick="window.print()" class="primary">Print quotation</button>`:''}</div>`;return}if(t==='Sales'||t==='Reports'){const g=S.sales.reduce((a,s)=>a+s.total,0),w=S.sales.reduce((a,s)=>a+s.wholesale,0),i=S.sales.reduce((a,s)=>a+s.income,0);c.innerHTML=`<h2>${t}</h2>${t==='Reports'?`<div class="metricGrid"><div class="metric">Sales<b>${S.sales.length}</b></div><div class="metric">Revenue<b>${money(g)}</b></div><div class="metric">Wholesale<b>${money(w)}</b></div><div class="metric">Income<b>${money(i)}</b></div></div>`:''}<div class="light tableWrap"><table class="tbl"><thead><tr><th>Sale</th><th>Customer</th><th>Date/Time</th><th>Total</th><th>Wholesale</th><th>Income</th></tr></thead><tbody>${S.sales.length?S.sales.map(s=>`<tr><td>${s.id}</td><td>${s.customer}</td><td>${s.time}</td><td>${money(s.total)}</td><td>${money(s.wholesale)}</td><td>${money(s.income)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">No completed sales yet.</td></tr>'}</tbody></table></div>`;return}if(t==='Staff'){staffView();return}c.innerHTML=`<h2>${t}</h2><div class="light" style="padding:18px">${t} records will appear here as you use the POS.</div>`}
async function staffView(){const c=document.getElementById('content');try{await staff()}catch(e){c.innerHTML=`<h2>Staff & Access</h2><div class="light" style="padding:18px"><p class="error">${esc(e.message)}</p></div>`;return}const pending=S.staffs.filter(s=>s.status==='Pending').length,active=S.staffs.filter(s=>s.status==='Active').length,disabled=S.staffs.filter(s=>s.status==='Disabled').length;c.innerHTML=`<h2>Staff & Access</h2><div class="light"><div class="toolbar"><div><b>Username-based POS accounts</b><div class="hint">No email invitations. Staff register with their name, username and password, then you approve them here.</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="copyReg" class="secondary">Copy Registration Link</button><button id="changeMine" class="secondary">Change My Password</button><button id="refreshStaff" class="primary">↻ Refresh</button></div></div><div class="staffSummary"><div class="staffStat">Active<b>${active}</b></div><div class="staffStat">Pending<b>${pending}</b></div><div class="staffStat">Disabled<b>${disabled}</b></div></div><div class="tableWrap"><table class="tbl"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Registered</th><th>Last Login</th><th>Actions</th></tr></thead><tbody>${S.staffs.map(s=>{const self=s.id===S.profile.id;return `<tr class="${s.status==='Disabled'?'disabled':''}"><td>${esc(s.full_name)}${self?' <span class="muted">(You)</span>':''}</td><td><b>${esc(s.username)}</b></td><td>${self?esc(s.app_role):`<select data-role="${s.id}"><option ${s.app_role==='Staff'?'selected':''}>Staff</option><option ${s.app_role==='Admin'?'selected':''}>Admin</option></select>`}</td><td class="${s.status==='Active'?'active':s.status==='Pending'?'pending':''}">${esc(s.status)}</td><td>${s.created_at?new Date(s.created_at).toLocaleString('en-PH',{timeZone:'Asia/Manila'}):'—'}</td><td>${s.last_login_at?new Date(s.last_login_at).toLocaleString('en-PH',{timeZone:'Asia/Manila'}):'Never'}</td><td>${self?`<button data-reset="${s.id}" class="secondary">Reset Password</button>`:`${s.status==='Pending'?`<button data-status="${s.id}" data-next="Active" class="success">Approve</button>`:s.status==='Active'?`<button data-status="${s.id}" data-next="Disabled" class="danger">Disable</button>`:`<button data-status="${s.id}" data-next="Active" class="success">Enable</button>`} <button data-reset="${s.id}" class="secondary">Reset Password</button> <button data-delete="${s.id}" class="danger">Delete</button>`}</td></tr>`}).join('')}</tbody></table></div></div>`;document.getElementById('refreshStaff').onclick=staffView;document.getElementById('copyReg').onclick=async()=>{const u=`${location.origin}/register`;try{await navigator.clipboard.writeText(u);toast('Registration link copied.')}catch{prompt('Copy this registration link:',u)}};document.getElementById('changeMine').onclick=changeMyPassword;document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_update_staff_local',{p_token:tok,p_account_id:b.dataset.status,p_status:b.dataset.next,p_role:null});if(error||!data?.ok)toast(data?.error||error?.message||'Unable to update account.');else{toast(`Account ${b.dataset.next.toLowerCase()}.`);staffView()}});document.querySelectorAll('[data-role]').forEach(sel=>sel.onchange=async()=>{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_update_staff_local',{p_token:tok,p_account_id:sel.dataset.role,p_status:null,p_role:sel.value});if(error||!data?.ok){toast(data?.error||error?.message||'Unable to update role.');staffView()}else toast('Role updated.')});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const who=S.staffs.find(x=>x.id===b.dataset.delete);if(!confirm(`Delete ${who?.full_name||'this account'}?`))return;const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_delete_staff_local',{p_token:tok,p_account_id:b.dataset.delete});if(error||!data?.ok)toast(data?.error||error?.message||'Unable to delete account.');else{toast('Account deleted.');staffView()}});document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>resetStaffPassword(b.dataset.reset))}
function resetStaffPassword(accountId){const who=S.staffs.find(x=>x.id===accountId),m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Reset Password</h2><button class="close">×</button></div><div class="welcome">Set a new password for <b>${esc(who?.full_name||'this account')}</b> (${esc(who?.username||'')}).</div><label>New password<input id="np1" type="password" minlength="8"></label><label>Confirm password<input id="np2" type="password" minlength="8"></label><p id="npm" class="error"></p><button id="saveNp" class="primary wide">Save New Password</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();document.getElementById('saveNp').onclick=async()=>{if(np1.value.length<8){npm.textContent='Password must be at least 8 characters.';return}if(np1.value!==np2.value){npm.textContent='Passwords do not match.';return}saveNp.disabled=true;saveNp.textContent='Saving…';const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_admin_set_password_local',{p_token:tok,p_account_id:accountId,p_new_password:np1.value});if(error||!data?.ok){npm.textContent=data?.error||error?.message||'Unable to reset password.';saveNp.disabled=false;saveNp.textContent='Save New Password';return}m.remove();if(accountId===S.profile.id){localStorage.removeItem(TOKEN_KEY);loginView('Password changed. Please log in again with your new password.')}else toast('Password reset.')}}
function changeMyPassword(){const m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Change My Password</h2><button class="close">×</button></div><label>Current password<input id="cp" type="password"></label><label>New password<input id="cn1" type="password" minlength="8"></label><label>Confirm new password<input id="cn2" type="password" minlength="8"></label><p id="cpm" class="error"></p><button id="saveCp" class="primary wide">Change Password</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();document.getElementById('saveCp').onclick=async()=>{if(cn1.value.length<8){cpm.textContent='New password must be at least 8 characters.';return}if(cn1.value!==cn2.value){cpm.textContent='Passwords do not match.';return}saveCp.disabled=true;saveCp.textContent='Saving…';const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_change_password_local',{p_token:tok,p_current_password:cp.value,p_new_password:cn1.value});if(error||!data?.ok){cpm.textContent=data?.error||error?.message||'Unable to change password.';saveCp.disabled=false;saveCp.textContent='Change Password';return}m.remove();toast('Password changed successfully.')}}
