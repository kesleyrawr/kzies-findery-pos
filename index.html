function sortProducts(list){
  const x=[...list],k=S.productSort||'name-asc';
  x.sort((a,b)=>{
    if(k==='name-asc')return a.name.localeCompare(b.name);
    if(k==='name-desc')return b.name.localeCompare(a.name);
    if(k==='price-high')return Number(b.selling||0)-Number(a.selling||0);
    if(k==='price-low')return Number(a.selling||0)-Number(b.selling||0);
    if(k==='qty-high')return Number(b.stock_qty||0)-Number(a.stock_qty||0);
    if(k==='qty-low')return Number(a.stock_qty||0)-Number(b.stock_qty||0);
    return 0;
  });

function enhanceTables(root=document){
  root.querySelectorAll('table.tbl').forEach(table=>{
    if(table.dataset.sortEnhanced==='1')return;
    table.dataset.sortEnhanced='1';
    const ths=[...table.querySelectorAll('thead th')],tbody=table.querySelector('tbody');
    if(!tbody)return;
    ths.forEach((th,idx)=>{
      const label=th.textContent.trim();
      if(!label||/^actions?$/i.test(label))return;
      th.classList.add('sortFilterHead');
      th.innerHTML='';
      const btn=document.createElement('button');btn.type='button';btn.className='thSortBtn';btn.textContent=label+' ↕';btn.dataset.dir='none';
      btn.onclick=()=>{
        const rows=[...tbody.rows],asc=btn.dataset.dir!=='asc';
        ths.forEach(x=>{const b=x.querySelector('.thSortBtn');if(b&&b!==btn){b.dataset.dir='none';b.textContent=b.textContent.replace(/ [▲▼]$/,'').replace(/ ↕$/,'')+' ↕'}});
        const val=row=>{
          const s=String(row.cells[idx]?.innerText||'').trim();
          const num=Number(s.replace(/[₱,#,%]/g,'').replace(/,/g,'').replace(/[^0-9.+-]/g,''));
          if(s && !Number.isNaN(num) && /[0-9]/.test(s))return {t:'n',v:num};
          const d=Date.parse(s);if(!Number.isNaN(d)&&(/[\/:-]/.test(s)||/[A-Za-z]{3}/.test(s)))return {t:'n',v:d};
          return {t:'s',v:s.toLowerCase()};
        };
        rows.sort((a,b)=>{const A=val(a),B=val(b);let z=A.t==='n'&&B.t==='n'?A.v-B.v:String(A.v).localeCompare(String(B.v));return asc?z:-z});
        rows.forEach(r=>tbody.appendChild(r));btn.dataset.dir=asc?'asc':'desc';btn.textContent=label+(asc?' ▲':' ▼');
      };
      th.append(btn);
    });
  });
}

function printInvoice(id){
  const s=S.sales.find(x=>Number(x.id)===Number(id));if(!s){toast('Invoice record not found.');return}
  const w=window.open('','_blank','width=900,height=1000');if(!w){toast('Allow pop-ups to print the invoice.');return}
  w.document.write('<!doctype html><html><head><title>'+esc(invoiceNumber(s))+'</title><style>@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;background:#fff;color:#111827;font-family:Arial,sans-serif}.a4Receipt{width:210mm;min-height:297mm;padding:15mm}.invHead{display:flex;justify-content:space-between;gap:24px;border-bottom:2px solid #0f172a;padding-bottom:14px;margin-bottom:16px}.invBrand{display:flex;align-items:flex-start;gap:12px}.invLogo{width:72px;height:72px;object-fit:contain;border-radius:12px}.invBrandText h1{margin:0;font-size:24px}.invBrandText p{margin:3px 0;color:#64748b}.invBusiness{margin-top:6px;font-size:10px;line-height:1.45;color:#475569}.invNo{text-align:right}.invNo b{font-size:17px}.invGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.invBox{padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:12px;line-height:1.5}.invTable{width:100%;border-collapse:collapse;margin:16px 0;font-size:12px}.invTable th,.invTable td{padding:9px;border-bottom:1px solid #d1d5db;text-align:left}.invTable th{background:#f3f4f6}.invTable td:last-child,.invTable th:last-child{text-align:right}.invTotals{width:360px;max-width:100%;margin-left:auto}.invTotals div{display:flex;justify-content:space-between;padding:5px 0}.invTotals .grand{font-size:17px;font-weight:900;border-top:2px solid #111827;margin-top:6px;padding-top:9px}.warrantyBox{margin-top:22px;padding:14px;border:1px solid #94a3b8;border-radius:8px;font-size:11px;line-height:1.55}.warrantyBox h3{margin:0 0 8px}.sigGrid{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:42px}.sigLine{padding-top:7px;border-top:1px solid #111827;text-align:center;font-size:11px}</style></head><body><div class="a4Receipt">'+invoiceBody(s)+'</div><script>window.onload=()=>{setTimeout(()=>window.print(),250)}<\/script></body></html>');w.document.close();
}
function receiptModal(id){
  const s=S.sales.find(x=>Number(x.id)===Number(id));if(!s)return;
  const m=document.createElement('div');m.className='modalBg';m.innerHTML='<div class="modal receiptModal"><div class="receiptToolbar"><button id="invPrint" class="primary">Print</button><button class="close secondary">Close</button></div><div class="a4Receipt">'+invoiceBody(s)+'</div></div>';document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();invPrint.onclick=()=>printInvoice(id);
}

function navHtml(n){return n.map(x=>{const main=`<button class="nav ${S.tab===x?'active':''}" data-tab="${x}"><span class="ico">${icons[x]}</span><span>${x}</span></button>`;if(x!=='Products'||S.tab!=='Products')return main;const subs=productCategories().map(cat=>{if(cat.name==='All Products'||cat.name==='Inactive Products')return `<button class="subnav ${S.productCategory===cat.name?'active':''}" data-category="${esc(cat.name)}"><span>${esc(cat.name)}</span><span>${cat.count}</span></button>`;return `<div class="subnav categoryToggleRow ${S.productCategory===cat.name?'active':''}"><button class="categoryNameBtn" data-category="${esc(cat.name)}"><span>${esc(cat.name)}</span><span>${cat.count}</span></button>${S.profile?.app_role==='Admin'?`<label class="miniCategoryToggle" title="${cat.enabled?'Active':'Hidden'} category"><input type="checkbox" data-sidebar-category-toggle="${esc(cat.name)}" ${cat.enabled?'checked':''}><span>${cat.enabled?'ON':'OFF'}</span></label>`:''}</div>`}).join('');return main+`<div class="subnavWrap">${subs}</div>`}).join('')}

async function profile(){const tok=localStorage.getItem(TOKEN_KEY)||'';if(!tok)return false;const {data,error}=await sb.rpc('kzies_session_local',{p_token:tok});if(error||!data?.ok){localStorage.removeItem(TOKEN_KEY);S.profile=null;return false}S.profile=data.profile;return true}
async function logoutLocal(){const tok=localStorage.getItem(TOKEN_KEY)||'';try{if(tok)await sb.rpc('kzies_logout_local',{p_token:tok})}catch{}clearInterval(backupTimer);backupTimer=null;localStorage.removeItem(TOKEN_KEY);S.profile=null;S.tab='POS';loginView()}
async function products(){
 try{
  const tok=localStorage.getItem(TOKEN_KEY)||'';
  const [{data,error},{data:catData,error:catError}]=await Promise.all([sb.rpc('kzies_get_products_local',{p_token:tok}),sb.rpc('kzies_get_category_settings_local',{p_token:tok})]);
  if(error||!data?.ok) throw new Error(data?.error||error?.message||'Unable to load products.');
  if(catError||!catData?.ok) console.warn('Unable to load category settings',catData?.error||catError?.message); else S.categorySettings=catData.categories||{};
  const rows=Array.isArray(data.products)?data.products:[];
  S.products=rows.map((x,i)=>{const retail=x.retail==null?null:Number(x.retail),wholesale=x.wholesale==null?null:Number(x.wholesale),selling=retail?Math.round(retail*1.15):null;return{id:x.id??i+1,brand:x.brand||'',name:x.name||'',retail,wholesale,notes:x.notes||'',category:x.category||'',image_data:x.image_data||'',china_import:!!x.china_import,china_cny_unit_cost:x.china_cny_unit_cost==null?null:Number(x.china_cny_unit_cost),china_qty_bought:x.china_qty_bought==null?null:Number(x.china_qty_bought),china_exchange_rate:x.china_exchange_rate==null?null:Number(x.china_exchange_rate),china_cost_basis:x.china_cost_basis||'Per Piece',china_units_per_pack:Number(x.china_units_per_pack||1),is_active:x.is_active!==false,selling,income:selling!=null&&wholesale!=null?selling-wholesale:null,stock_initialized:!!x.stock_initialized,stock_tracked:!!x.stock_tracked,stock_qty:Number(x.stock_qty||0),stock_in:Number(x.stock_in||0),stock_out:Number(x.stock_out||0),average_cost:Number(x.average_cost||0),inventory_value:Number(x.inventory_value||0),stock_purchase_cost:Number(x.stock_purchase_cost||0)}}).filter(x=>x.name);
  if(!S.products.length) throw new Error('No products are available yet.');scheduleAutoBackupSoon();
 }catch(e){console.error('Unable to load products',e);S.products=[]}
}

async function loadCustomers(){try{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_list_customers_local',{p_token:tok});if(error||!data?.ok)throw new Error(data?.error||error?.message);S.customers=(data.customers||[]).map(x=>({...x,loyalty_points:Number(x.loyalty_points||0)}))}catch(e){console.error('Unable to load customers',e);S.customers=[]}}
async function actionPasswordInfo(){try{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_action_password_info_local',{p_token:tok});if(error||!data?.ok)throw new Error(data?.error||error?.message);S.actionPasswordInfo=data}catch(e){S.actionPasswordInfo={configured:false}}}
async function staff(){const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_list_staff_local',{p_token:tok});if(error||!data?.ok){S.staffs=[];throw new Error(data?.error||error?.message||'Unable to load staff accounts.')}S.staffs=data.staff||[];S.invites=[]}
function clock(){const d=new Date();return `<div class="clock"><b>${d.toLocaleDateString('en-PH',{timeZone:'Asia/Manila',weekday:'short',month:'short',day:'numeric',year:'numeric'})}</b><span>${d.toLocaleTimeString('en-PH',{timeZone:'Asia/Manila',hour:'numeric',minute:'2-digit',second:'2-digit'})} • PH Time</span></div>`}
function backupStatusHtml(){
  const raw=localStorage.getItem('kzies_backup_last_saved');
  if(!raw)return '<div class="backupChip none"><b>Latest Backup</b><span>No backup yet</span></div>';
  const d=new Date(raw);
  if(Number.isNaN(d.getTime()))return '<div class="backupChip none"><b>Latest Backup</b><span>No backup yet</span></div>';
  return '<div class="backupChip"><b>✓ Latest Backup</b><span>'+d.toLocaleString('en-PH',{timeZone:'Asia/Manila',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</span></div>';
}
function refreshBackupStatusHeader(){const el=document.getElementById('backupStatus');if(el)el.innerHTML=backupStatusHtml()}
function markBackupSaved(){backupLastSaved=new Date();localStorage.setItem('kzies_backup_last_saved',backupLastSaved.toISOString());refreshBackupStatusHeader()}
async function loadInvoiceInfo(){
  if(S.profile?.app_role!=='Admin')return;
  const tok=localStorage.getItem(TOKEN_KEY)||'';
  const {data,error}=await sb.rpc('kzies_invoice_info_local',{p_token:tok});
  if(error||!data?.ok)throw new Error(data?.error||error?.message||'Unable to load invoice counter.');
  S.invoiceInfo={current_number:Number(data.current_number||0),total_invoices:Number(data.total_invoices||0),latest_invoice:data.latest_invoice||'—'};
}
async function resetInvoiceCounter(){
  if(S.profile?.app_role!=='Admin')return;
  if(!confirm('Reset the invoice counter to 0? Existing sales and their old invoice numbers will stay unchanged. The next new invoice will be KZF-INV-000001.'))return;
  const tok=localStorage.getItem(TOKEN_KEY)||'';
  const {data,error}=await sb.rpc('kzies_reset_invoice_counter_local',{p_token:tok});
  if(error||!data?.ok){toast(data?.error||error?.message||'Unable to reset invoice counter.');return}
  await loadInvoiceInfo();toast('Invoice counter reset to 0.');staffView();
}

function readImageFile(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Unable to read image.'));img.src=r.result};
    r.onerror=()=>reject(new Error('Unable to read image file.'));
    r.readAsDataURL(file);
  });
}
function bgDistance(r,g,b,br,bg,bb){return Math.sqrt((r-br)*(r-br)+(g-bg)*(g-bg)+(b-bb)*(b-bb))}
async function processProductPhoto(file,strength=55){
  if(!file)throw new Error('Choose a product photo first.');
  if(!/^image\/(png|jpeg|webp)$/i.test(file.type))throw new Error('Use a JPG, PNG, or WEBP image.');
  if(file.size>8*1024*1024)throw new Error('Image is too large. Please use a photo under 8 MB.');
  const img=await readImageFile(file);
  const maxSide=850,scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const src=document.createElement('canvas');src.width=w;src.height=h;
  const ctx=src.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
  const data=ctx.getImageData(0,0,w,h),px=data.data,border=[];
  const step=Math.max(1,Math.floor(Math.min(w,h)/70));
  for(let x=0;x<w;x+=step){border.push(x*4,((h-1)*w+x)*4)}
  for(let y=0;y<h;y+=step){border.push((y*w)*4,(y*w+w-1)*4)}
  let br=0,bg=0,bb=0,n=0;
  for(const i of border){if(px[i+3]>10){br+=px[i];bg+=px[i+1];bb+=px[i+2];n++}}
  br=n?br/n:255;bg=n?bg/n:255;bb=n?bb/n:255;
  const tol=Math.max(12,Math.min(150,Number(strength)||55));
  const seen=new Uint8Array(w*h),queue=new Uint32Array(w*h);let head=0,tail=0;
  const push=(idx)=>{
    if(seen[idx])return;
    const j=idx*4;
    if(px[j+3]>0&&bgDistance(px[j],px[j+1],px[j+2],br,bg,bb)<=tol){seen[idx]=1;queue[tail++]=idx}
  };
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}
  for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
  while(head<tail){
    const idx=queue[head++],x=idx%w,y=(idx/w)|0,j=idx*4;px[j+3]=0;
    if(x>0)push(idx-1);if(x<w-1)push(idx+1);if(y>0)push(idx-w);if(y<h-1)push(idx+w);
  }
  ctx.putImageData(data,0,0);
  const outData=ctx.getImageData(0,0,w,h).data;
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(outData[(y*w+x)*4+3]>20){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}
  }
  if(maxX<minX||maxY<minY)throw new Error('Background removal removed the whole image. Lower the strength and try again.');
  const bw=maxX-minX+1,bh=maxY-minY+1,size=600,pad=48,fit=Math.min((size-pad*2)/bw,(size-pad*2)/bh);
  const dw=bw*fit,dh=bh*fit,dx=(size-dw)/2,dy=(size-dh)/2;
  const out=document.createElement('canvas');out.width=size;out.height=size;
  const octx=out.getContext('2d');octx.clearRect(0,0,size,size);octx.imageSmoothingEnabled=true;octx.imageSmoothingQuality='high';
  octx.drawImage(src,minX,minY,bw,bh,dx,dy,dw,dh);
  return out.toDataURL('image/webp',0.9);
}
function attachProductPhotoEditor(prefix,initialImage){
  const file=document.getElementById(prefix+'Photo'),preview=document.getElementById(prefix+'Preview'),
        strength=document.getElementById(prefix+'Strength'),strengthVal=document.getElementById(prefix+'StrengthVal'),
        reprocess=document.getElementById(prefix+'Reprocess'),remove=document.getElementById(prefix+'RemovePhoto'),
        msg=document.getElementById(prefix+'PhotoMsg');
  let current=initialImage||'',sourceFile=null;
  const draw=()=>{
    preview.innerHTML=current?'<img src="'+current+'" alt="Product preview">':'<div class="photoPreviewEmpty">Upload a product photo.<br>It will be saved as a transparent 600 × 600 square.</div>';
    remove.style.display=current?'inline-block':'none';
  };
  const process=async()=>{
    if(!sourceFile){msg.textContent='Choose a new photo first.';return}
    msg.textContent='Removing background…';reprocess.disabled=true;
    try{current=await processProductPhoto(sourceFile,Number(strength.value));draw();msg.textContent='✓ Background removed. Check the preview before saving.'}
    catch(e){msg.textContent=e.message}
    reprocess.disabled=false;
  };
  file.onchange=async()=>{sourceFile=file.files&&file.files[0]||null;if(sourceFile)await process()};
  strength.oninput=()=>strengthVal.textContent=strength.value;
  reprocess.onclick=process;
  remove.onclick=()=>{current='';sourceFile=null;file.value='';draw();msg.textContent='Photo removed. Save the product to apply.'};
  draw();
  return{getImage:()=>current};
}

async function toggleStockTracking(id,enabled,input){
  if(S.profile?.app_role!=='Admin'){if(input)input.checked=!enabled;return}
  const p=S.products.find(x=>x.id===id);if(!p){if(input)input.checked=!enabled;return}
  if(!enabled&&p.stock_tracked){
    const ok=confirm('Turn stock tracking OFF for '+p.name+'?\n\nThe saved quantity, stock history, supplier receipts, and capital records will stay. The POS will simply stop blocking sales based on quantity until you turn it ON again.');
    if(!ok){if(input)input.checked=true;return}
  }
  if(input)input.disabled=true;
  const tok=localStorage.getItem(TOKEN_KEY)||'';
  const {data,error}=await sb.rpc('kzies_set_stock_tracking_local',{p_token:tok,p_product_id:id,p_enabled:enabled});
  if(error||!data?.ok){
    if(input){input.disabled=false;input.checked=!enabled}
    toast(data?.error||error?.message||'Unable to change stock tracking.');return
  }
  if(data.needs_opening){
    if(input){input.disabled=false;input.checked=false}
    toast('Set the opening quantity first.');
    stockModal(id);
    return
  }
  await products();scheduleAutoBackupSoon();
  toast('Stock tracking '+(enabled?'ON':'OFF')+' • '+p.name);
  render();
}

function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=()=>reject(new Error('Unable to read file.'));r.readAsDataURL(file)})}

      supplier_warranty_until:x.supplier_warranty_until||null,receipt_notes:x.receipt_notes||'',

    if(x.supplier_warranty_until&&(!g.supplier_warranty_until||String(x.supplier_warranty_until)>String(g.supplier_warranty_until)))g.supplier_warranty_until=x.supplier_warranty_until;

function addMonthKey(key,delta){
  const p=String(key).split('-').map(Number),d=new Date(Date.UTC(p[0],p[1]-1+delta,1));
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');
}
function firstLoanDueMonth(start,dueDay){
  const v=String(start||phToday()),p=v.split('-').map(Number),key=String(p[0]).padStart(4,'0')+'-'+String(p[1]).padStart(2,'0');
  return p[2]<=dueDay?key:addMonthKey(key,1);
}
function loanDueInfo(f){
  const monthly=Number(f.settings.monthly_payment||0),balance=Number(f.loan.balance||0),dueDay=Number(f.settings.due_day||16);
  if(monthly<=0||balance<=0)return null;
  const now=phDateParts(),current=now.year+'-'+String(now.month).padStart(2,'0'),payments=f.payments||[];
  let candidate=firstLoanDueMonth(f.settings.loan_started_at,dueDay);
  const paidFor=key=>payments.filter(p=>String(p.due_month||'').slice(0,7)===key).reduce((a,p)=>a+Number(p.amount||0),0);
  for(let guard=0;guard<240&&candidate<=current;guard++){
    const paid=paidFor(candidate),target=Math.min(monthly,Math.max(0,balance+paid));
    if(paid+0.005<target){
      const overdue=candidate<current||(candidate===current&&now.day>dueDay),today=candidate===current&&now.day===dueDay;
      const days=candidate===current?Math.max(0,dueDay-now.day):0;
      return {month:candidate,due_date:candidate+'-'+String(dueDay).padStart(2,'0'),paid:paid,target:target,remaining:Math.max(0,target-paid),overdue:overdue,today:today,label:overdue?'Overdue':today?'Due today':candidate===current?'Due in '+days+' day'+(days===1?'':'s'):'Upcoming'};
    }
    candidate=addMonthKey(candidate,1);
  }
  const paid=paidFor(candidate),target=Math.min(monthly,Math.max(0,balance+paid));
  return {month:candidate,due_date:candidate+'-'+String(dueDay).padStart(2,'0'),paid:paid,target:target,remaining:Math.max(0,target-paid),overdue:false,today:false,label:'Upcoming'};
}
function financePaymentModal(f,due){

  const m=document.createElement('div');m.className='modalBg';
  const suggested=due?Math.max(0,due.remaining):Math.min(Number(f.settings.monthly_payment||0),Number(f.loan.balance||0));
  const month=due?.month||phToday().slice(0,7);
  m.innerHTML='<div class="modal"><div class="modalHead"><h2>Record Loan Payment</h2><button class="close">×</button></div><div class="welcome">This payment reduces the loan balance. It does not reduce your recorded sales profit.</div><div class="formGrid"><label>For payment month<input id="fpMonth" type="month" value="'+esc(month)+'"></label><label>Paid date<input id="fpDate" type="date" value="'+phToday()+'"></label><label>Amount<input id="fpAmount" type="number" min="0.01" step="0.01" value="'+(suggested>0?suggested:'')+'"></label><label class="full">Notes<textarea id="fpNotes" rows="3" placeholder="Optional note, reference, lender, etc."></textarea></label></div><p id="fpMsg" class="error"></p><button id="fpSave" class="primary wide modalStickyAction">Save Payment</button></div>';
  document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();

    const amount=Number(fpAmount.value||0);
    if(!fpMonth.value||!fpDate.value||amount<=0){fpMsg.textContent='Complete the payment month, date, and amount.';return}
    fpSave.disabled=true;fpSave.textContent='Saving…';
    const tok=localStorage.getItem(TOKEN_KEY)||'';
    const {data,error}=await sb.rpc('kzies_add_loan_payment_local',{p_token:tok,p_due_month:fpMonth.value+'-01',p_paid_date:fpDate.value,p_amount:amount,p_notes:fpNotes.value.trim()});
    if(error||!data?.ok){fpMsg.textContent=data?.error||error?.message||'Unable to save payment.';fpSave.disabled=false;fpSave.textContent='Save Payment';return}

  };
}
async function deleteFinancePayment(id){
  if(S.profile?.app_role!=='Admin'||!confirm('Delete this loan payment record?'))return;

const PSGC_API='https://psgc.cloud/api/v2';
const __phGeoCache=new Map();
async function phGeo(path){
  if(__phGeoCache.has(path))return __phGeoCache.get(path);
  const key='kzies_geo_'+path.replace(/[^a-z0-9]+/gi,'_');
  try{
    const cached=localStorage.getItem(key);
    if(cached){
      const parsed=JSON.parse(cached);
      if(parsed&&Date.now()-Number(parsed.saved||0)<86400000&&Array.isArray(parsed.data)){
        __phGeoCache.set(path,parsed.data);return parsed.data;
      }
    }
  }catch{}
  const res=await fetch(PSGC_API+path,{headers:{Accept:'application/json'}});
  if(!res.ok)throw new Error('Address list unavailable.');
  const data=await res.json(),rows=Array.isArray(data)?data:(Array.isArray(data.data)?data.data:[]);
  __phGeoCache.set(path,rows);
  try{localStorage.setItem(key,JSON.stringify({saved:Date.now(),data:rows}))}catch{}
  return rows;
}
function placeNorm(v){return String(v||'').toLowerCase().replace(/\b(city|municipality|province)\s+of\s+/g,'').replace(/\b(city|municipality|province)\b/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function geoOptionMatch(rows,name){
  const n=placeNorm(name);if(!n)return null;
  return rows.find(x=>placeNorm(x.name)===n)||rows.find(x=>placeNorm(x.name).includes(n)||n.includes(placeNorm(x.name)))||null;
}
function setGeoOptions(sel,rows,placeholder,selectedName,special=[]){
  const all=[...special,...rows].sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  sel.innerHTML='<option value="">'+placeholder+'</option>'+all.map(x=>'<option value="'+esc(x.name)+'" data-code="'+esc(x.code||'')+'" data-region="'+(x.isRegion?'1':'0')+'">'+esc(x.name)+'</option>').join('');
  if(selectedName){
    const hit=geoOptionMatch(all,selectedName);
    if(hit)sel.value=hit.name;
    else{
      const opt=document.createElement('option');opt.value=selectedName;opt.textContent=selectedName;opt.dataset.code='';sel.appendChild(opt);sel.value=selectedName;
    }
  }
}

      try{

        if(seq!==active)return;
        setGeoOptions(provinceEl,provinces,'Select province',v.province||'',[
          {code:'130000000',name:'Metro Manila (NCR)',isRegion:true}
        ]);
        await loadCities(v.city||'',v.barangay||'',seq);
      }catch(e){
        if(v.province){provinceEl.innerHTML='<option value="'+esc(v.province)+'">'+esc(v.province)+'</option>'}
        else provinceEl.innerHTML='<option value="">Address list unavailable</option>';
        if(v.city)cityEl.innerHTML='<option value="'+esc(v.city)+'">'+esc(v.city)+'</option>';
        if(v.barangay)barangayEl.innerHTML='<option value="'+esc(v.barangay)+'">'+esc(v.barangay)+'</option>';
      }finally{
        provinceEl.classList.remove('geoLoading');cityEl.classList.remove('geoLoading');barangayEl.classList.remove('geoLoading');
      }
    }
  };
  async function loadCities(selectedCity='',selectedBarangay='',seq=++active){
    cityEl.innerHTML='<option value="">Loading cities…</option>';barangayEl.innerHTML='<option value="">Select city first</option>';
    const op=provinceEl.selectedOptions[0],code=op?.dataset.code||'',isRegion=op?.dataset.region==='1';
    if(!code){if(selectedCity)setGeoOptions(cityEl,[],'Select city / municipality',selectedCity);return}
    try{
      const rows=await phGeo((isRegion?'/regions/':'/provinces/')+encodeURIComponent(code)+'/cities-municipalities');
      if(seq!==active)return;
      setGeoOptions(cityEl,rows,'Select city / municipality',selectedCity);
      await loadBarangays(selectedBarangay,seq);
    }catch{
      setGeoOptions(cityEl,[],'Select city / municipality',selectedCity);
      if(selectedBarangay)setGeoOptions(barangayEl,[],'Select barangay',selectedBarangay);
    }
  }
  async function loadBarangays(selectedBarangay='',seq=++active){
    barangayEl.innerHTML='<option value="">Loading barangays…</option>';
    const code=cityEl.selectedOptions[0]?.dataset.code||'';
    if(!code){setGeoOptions(barangayEl,[],'Select barangay',selectedBarangay);return}
    try{
      const rows=await phGeo('/cities-municipalities/'+encodeURIComponent(code)+'/barangays');
      if(seq!==active)return;
      setGeoOptions(barangayEl,rows,'Select barangay',selectedBarangay);
    }catch{setGeoOptions(barangayEl,[],'Select barangay',selectedBarangay)}
  }
  provinceEl.onchange=()=>{active++;loadCities('', '', active)};
  cityEl.onchange=()=>{active++;loadBarangays('',active)};
  await controller.apply(initial);
  controller.refreshCities=loadCities;controller.refreshBarangays=loadBarangays;
  return controller;
}
function loyaltyPointsForSpend(amount){return Math.floor(Math.max(0,Number(amount)||0)/500)*3}
function findSavedCustomer(name,contact){
  const c=String(contact||'').replace(/\D/g,'');
  const n=String(name||'').trim().toLowerCase();
  if(c){const hit=S.customers.find(x=>String(x.contact_number||'').replace(/\D/g,'')===c);if(hit)return hit}
  if(n){
    const hits=S.customers.filter(x=>String(x.full_name||'').trim().toLowerCase()===n);
    if(hits.length===1)return hits[0];
  }
  return null;
}

  const pointsToEarn=()=>coPricing.value==='No Markup'?0:loyaltyPointsForSpend(currentSubtotal());
  function refreshPricing(){const noMarkup=coPricing.value==='No Markup',sub=currentSubtotal(),saved=Math.max(0,normalSubtotal-sub);coProductSubtotal.textContent=money(sub);m.querySelectorAll('[data-checkout-price]').forEach(el=>el.disabled=noMarkup);coPricingHint.innerHTML=noMarkup?'<b>No Markup active.</b> Items use Wholesale Price. Custom item prices are disabled. Savings vs default price: <b>'+money(saved)+'</b>. Loyalty points: <b>0 pts</b>.':'Edit the Sale Unit Price above if this customer paid a different amount.';}

const calcEditCard=()=>{const delivery=Math.max(0,Number(esDelivery.value)||0),base=Number(x.subtotal||0)+delivery,isCC=esPayment.value==='Credit Card';esCcBox.style.display=isCC?'block':'none';if(!isCC){esSummary.innerHTML=`<div class="summaryRow"><span>Amount due</span><strong>${money(base)}</strong></div><div class="summaryRow totalLine"><span>Final total</span><strong>${money(base)}</strong></div>`;return{delivery,base,cardAmount:0,noFeeAmount:base,cardFee:0,total:base}}const partial=esCoverage.value==='Partial';esCardAmountWrap.style.display=partial?'block':'none';let cardAmount;if(partial){esCardAmount.readOnly=false;cardAmount=Math.max(0,Math.min(base,Number(esCardAmount.value)||0));if(Number(esCardAmount.value)>base)esCardAmount.value=base.toFixed(2)}else{cardAmount=base;esCardAmount.value=base.toFixed(2)}const noFeeAmount=Math.max(0,base-cardAmount),cardFee=Math.round(cardAmount*3)/100,total=base+cardFee;esSummary.innerHTML=partial?`<div class="summaryRow"><span>Amount due before card fee</span><strong>${money(base)}</strong></div><div class="summaryRow"><span>Amount charged to card</span><strong>${money(cardAmount)}</strong></div><div class="summaryRow"><span>Other payment amount</span><strong>${money(noFeeAmount)}</strong></div><div class="summaryRow"><span>Credit Card fee (3%)</span><strong>${money(cardFee)}</strong></div><div class="summaryRow totalLine"><span>Final total</span><strong>${money(total)}</strong></div>`:`<div class="summaryRow"><span>Amount due before card fee</span><strong>${money(base)}</strong></div><div class="summaryRow"><span>Credit Card fee (3%)</span><strong>${money(cardFee)}</strong></div><div class="summaryRow totalLine"><span>Final total</span><strong>${money(total)}</strong></div>`;return{delivery,base,cardAmount,noFeeAmount,cardFee,total}};

esSave.onclick=async()=>{const pay=calcEditCard();if(esPayment.value==='Credit Card'&&esCoverage.value==='Partial'&&pay.cardAmount<=0){esMsg.textContent='Enter the amount that will be charged to the Credit Card.';return}if(esPayment.value!=='Cash'&&!esPaymentRef.value.trim()){esMsg.textContent='Enter the payment reference number.';return}esSave.disabled=true;const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_update_sale_split_local',{p_token:tok,p_sale_id:id,p_customer_name:esName.value.trim(),p_contact_number:esContact.value.trim(),p_address_line:esAddress.value.trim(),p_barangay:esBarangay.value.trim(),p_city:esCity.value.trim(),p_province:esProvince.value.trim(),p_zip_code:esZip.value.trim(),p_payment_method:esPayment.value,p_delivery_fee:pay.delivery,p_credit_card_amount:pay.cardAmount,p_payment_reference:esPaymentRef.value.trim()});if(error||!data?.ok){esMsg.textContent=data?.error||error?.message||'Unable to update sale.';esSave.disabled=false;return}m.remove();await businessData();toast('Sale updated.');render()}}
async function deleteSale(id){if(S.profile?.app_role==='Admin'){if(!confirm(`Delete sale #${id}?`))return;return runDeleteSale(id,null)}const m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Admin Approval Required</h2><button class="close">×</button></div><div class="welcome">Staff deletion of sale #${id} requires the separate Admin Action Password.</div><label>Admin Action Password<input id="dap" type="password"></label><p id="dam" class="error"></p><button id="daGo" class="danger wide">Delete Sale</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();daGo.onclick=async()=>{daGo.disabled=true;const ok=await runDeleteSale(id,dap.value,dam);if(ok)m.remove();else daGo.disabled=false}}
async function runDeleteSale(id,password,msgEl){const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_delete_sale_local',{p_token:tok,p_sale_id:id,p_action_password:password});if(error||!data?.ok){const msg=data?.error||error?.message||'Unable to delete sale.';if(msgEl)msgEl.textContent=msg;else toast(msg);return false}await Promise.all([businessData(),products()]);toast(`Sale #${id} deleted. Stock restored when applicable.`);render();return true}

function editCustomerModal(id){
  if(S.profile?.app_role!=='Admin')return;
  const x=S.customers.find(c=>c.id===id);if(!x)return;
  const m=document.createElement('div');m.className='modalBg';
  m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Edit Customer</h2><button class="close">×</button></div><div class="formGrid">
    <label class="full">Customer name<input id="ecName" value="${esc(x.full_name)}"></label>
    <label>Contact number<input id="ecContact" value="${esc(x.contact_number)}"></label>
    <label>ZIP code<input id="ecZip" value="${esc(x.zip_code)}"></label>
    <label class="full">Home No. / Street / Subdivision<input id="ecAddress" value="${esc(x.address_line)}"></label>
    <label>Province<select id="ecProvince"><option>Loading provinces…</option></select></label>
    <label>City / Municipality<select id="ecCity"><option>Select province first</option></select></label>
    <label>Barangay<select id="ecBarangay"><option>Select city first</option></select></label>
    <div class="geoHint">Province, city/municipality, and barangay use Philippine PSGC reference lists.</div>
  </div><p id="ecMsg" class="error"></p><button id="ecSave" class="primary wide">Save Customer</button></div>`;
  document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();
  setupPhAddress(ecProvince,ecCity,ecBarangay,{province:x.province,city:x.city,barangay:x.barangay});
  ecSave.onclick=async()=>{
    if([ecName,ecContact,ecAddress,ecBarangay,ecCity,ecProvince,ecZip].some(v=>!String(v.value||'').trim())){ecMsg.textContent='Please complete the customer details.';return}
    ecSave.disabled=true;
    const tok=localStorage.getItem(TOKEN_KEY)||'';
    const {data,error}=await sb.rpc('kzies_update_customer_local',{
      p_token:tok,p_customer_id:id,p_full_name:ecName.value.trim(),p_contact_number:ecContact.value.trim(),
      p_address_line:ecAddress.value.trim(),p_barangay:ecBarangay.value.trim(),p_city:ecCity.value.trim(),
      p_province:ecProvince.value.trim(),p_zip_code:ecZip.value.trim()
    });
    if(error||!data?.ok){ecMsg.textContent=data?.error||error?.message||'Unable to update customer.';ecSave.disabled=false;return}
    m.remove();await loadCustomers();scheduleAutoBackupSoon();toast('Customer updated.');render();
  };
}
async function deleteCustomer(id){if(S.profile?.app_role!=='Admin')return;const x=S.customers.find(c=>c.id===id);if(!confirm(`Delete customer ${x?.full_name||''}? Existing sales will keep their customer snapshot.`))return;const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_delete_customer_local',{p_token:tok,p_customer_id:id});if(error||!data?.ok){toast(data?.error||error?.message||'Unable to delete customer.');return}await loadCustomers();toast('Customer deleted.');render()}
function setActionPassword(){const m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>${S.actionPasswordInfo?.configured?'Change':'Set'} Admin Action Password</h2><button class="close">×</button></div><div class="welcome">This is separate from your Admin login password. Staff will need it only to delete protected order entries.</div><label>Your current Admin login password<input id="apLogin" type="password"></label><label>New Admin Action Password<input id="ap1" type="password" minlength="8"></label><label>Confirm Action Password<input id="ap2" type="password" minlength="8"></label><p id="apMsg" class="error"></p><button id="apSave" class="primary wide">Save Action Password</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();apSave.onclick=async()=>{if(ap1.value.length<8){apMsg.textContent='Use at least 8 characters.';return}if(ap1.value!==ap2.value){apMsg.textContent='Passwords do not match.';return}apSave.disabled=true;const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_set_action_password_local',{p_token:tok,p_login_password:apLogin.value,p_new_action_password:ap1.value});if(error||!data?.ok){apMsg.textContent=data?.error||error?.message||'Unable to save action password.';apSave.disabled=false;return}m.remove();await actionPasswordInfo();toast('Admin Action Password saved.');staffView()}}
