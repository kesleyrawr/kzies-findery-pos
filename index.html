async function profile(){const tok=localStorage.getItem(TOKEN_KEY)||'';if(!tok)return false;const {data,error}=await sb.rpc('kzies_session_local',{p_token:tok});if(error||!data?.ok){localStorage.removeItem(TOKEN_KEY);S.profile=null;return false}S.profile=data.profile;return true}
async function logoutLocal(){const tok=localStorage.getItem(TOKEN_KEY)||'';try{if(tok)await sb.rpc('kzies_logout_local',{p_token:tok})}catch{}localStorage.removeItem(TOKEN_KEY);S.profile=null;S.tab='POS';loginView()}
async function products(){
 try{
  const tok=localStorage.getItem(TOKEN_KEY)||'';
  const {data,error}=await sb.rpc('kzies_get_products_local',{p_token:tok});
  if(error||!data?.ok) throw new Error(data?.error||error?.message||'Unable to load products.');
  const rows=Array.isArray(data.products)?data.products:[];
  S.products=rows.map((x,i)=>{const retail=x.retail==null?null:Number(x.retail),wholesale=x.wholesale==null?null:Number(x.wholesale),selling=retail?Math.round(retail*1.3):null;return{id:x.id??i+1,brand:x.brand||'',name:x.name||'',retail,wholesale,notes:x.notes||'',category:x.category||'',selling,income:selling!=null&&wholesale!=null?selling-wholesale:null}}).filter(x=>x.name);
  if(!S.products.length) throw new Error('No products are available yet.');
 }catch(e){console.error('Unable to load products',e);S.products=[]}
}
async function businessData(){await Promise.all([loadSales(),loadCustomers()])}
async function loadSales(){try{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_list_sales_local',{p_token:tok});if(error||!data?.ok)throw new Error(data?.error||error?.message);S.sales=(data.sales||[]).map(x=>({...x,subtotal:Number(x.subtotal||0),delivery_fee:Number(x.delivery_fee||0),payment_fee:Number(x.payment_fee||0),credit_card_amount:Number(x.credit_card_amount||0),non_card_amount:Number(x.non_card_amount||0),total:Number(x.total||0),wholesale_total:Number(x.wholesale_total||0),income:Number(x.income||0)}))}catch(e){console.error('Unable to load sales',e);S.sales=[]}}
async function loadCustomers(){try{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_list_customers_local',{p_token:tok});if(error||!data?.ok)throw new Error(data?.error||error?.message);S.customers=data.customers||[]}catch(e){console.error('Unable to load customers',e);S.customers=[]}}
async function actionPasswordInfo(){try{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_action_password_info_local',{p_token:tok});if(error||!data?.ok)throw new Error(data?.error||error?.message);S.actionPasswordInfo=data}catch(e){S.actionPasswordInfo={configured:false}}}
async function staff(){const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_list_staff_local',{p_token:tok});if(error||!data?.ok){S.staffs=[];throw new Error(data?.error||error?.message||'Unable to load staff accounts.')}S.staffs=data.staff||[];S.invites=[]}
function clock(){const d=new Date();return `<div class="clock"><b>${d.toLocaleDateString('en-PH',{timeZone:'Asia/Manila',weekday:'short',month:'short',day:'numeric',year:'numeric'})}</b><span>${d.toLocaleTimeString('en-PH',{timeZone:'Asia/Manila',hour:'numeric',minute:'2-digit',second:'2-digit'})} • PH Time</span></div>`}

function cards(list,adminActions=false){return `<div class="grid">${list.map(p=>`<article class="product"><div class="thumb">⌨️</div><div class="body"><div class="brandName">${esc(p.brand)}</div><h3>${esc(p.name)}</h3><div class="price">${p.selling?money(p.selling):'Contact us'}</div><div class="cost">Retail: ${p.retail?money(p.retail):'Contact us'}<br>Wholesale: ${p.wholesale?money(p.wholesale):'Contact us'}</div>${p.income!=null?`<div class="income">Income: ${money(p.income)}</div>`:''}<button data-add="${p.id}" ${!p.selling?'disabled':''}>Add to cart</button>${adminActions&&S.profile?.app_role==='Admin'?`<div class="productActions"><button class="secondary" data-edit-product="${p.id}">Edit</button><button class="danger" data-delete-product="${p.id}">Delete</button></div>`:''}</div></article>`).join('')}</div>`}
function bindAdd(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=S.products.find(x=>x.id==b.dataset.add),q=S.cart.find(x=>x.id===p.id);rememberRecent([p]);q?q.qty++:S.cart.push({...p,qty:1});render()})}
function bindProductAdminActions(){document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>editProductModal(Number(b.dataset.editProduct)));document.querySelectorAll('[data-delete-product]').forEach(b=>b.onclick=()=>deleteProduct(Number(b.dataset.deleteProduct)))}
async function deleteProduct(id){if(S.profile?.app_role!=='Admin')return;const p=S.products.find(x=>x.id===id);if(!confirm(`Delete ${p?.name||'this product'} from Kzie’s product list?`))return;const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_delete_product_local',{p_token:tok,p_product_id:id});if(error||!data?.ok){toast(data?.error||error?.message||'Unable to delete product.');return}await products();toast('Product deleted.');shell()}
function editProductModal(id){const p=S.products.find(x=>x.id===id);if(!p||S.profile?.app_role!=='Admin')return;const cats=['Keyboards','Mice','Headsets','Mouse Pads','Cooling & Fans','Thermal Paste','Accessories','Other'];const current=p.category||categoryOf(p);const m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Edit Product</h2><button class="close">×</button></div><div class="formGrid"><label>Brand<input id="epBrand" value="${esc(p.brand)}"></label><label>Category<select id="epCat">${cats.map(x=>`<option ${x===current?'selected':''}>${x}</option>`).join('')}</select></label><label class="full">Product name<input id="epName" value="${esc(p.name)}"></label><label>Retail price<input id="epRetail" type="number" min="0" step="0.01" value="${p.retail??''}"></label><label>Wholesale price<input id="epWholesale" type="number" min="0" step="0.01" value="${p.wholesale??''}"></label><label class="full">Notes<input id="epNotes" value="${esc(p.notes||'')}"></label></div><p id="epMsg" class="error"></p><button id="epSave" class="primary wide">Save Product</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();epSave.onclick=async()=>{if(!epName.value.trim()){epMsg.textContent='Product name is required.';return}epSave.disabled=true;epSave.textContent='Saving…';const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_update_product_local',{p_token:tok,p_product_id:id,p_brand:epBrand.value.trim(),p_name:epName.value.trim(),p_retail:epRetail.value===''?null:Number(epRetail.value),p_wholesale:epWholesale.value===''?null:Number(epWholesale.value),p_notes:epNotes.value.trim(),p_category:epCat.value});if(error||!data?.ok){epMsg.textContent=data?.error||error?.message||'Unable to save product.';epSave.disabled=false;epSave.textContent='Save Product';return}m.remove();await products();toast('Product updated.');shell()}}

function checkoutModal(){if(!S.cart.length)return;const subtotal=S.cart.reduce((a,p)=>a+p.selling*p.qty,0),m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Customer & Payment</h2><button class="close">×</button></div><div class="welcome">Products subtotal: <b>${money(subtotal)}</b></div><div class="formGrid"><label class="full">Customer name<input id="coName" required></label><label>Contact number<input id="coContact" required></label><label>ZIP code<input id="coZip" required></label><label class="full">Home No. / Street / Subdivision<input id="coAddress" required></label><label>Barangay<input id="coBarangay" required></label><label>City<input id="coCity" required></label><label>Province<input id="coProvince" required></label><label>Payment method<select id="coPayment"><option>Cash</option><option>E-Wallet</option><option>Online Banking</option><option>Credit Card</option></select></label><label>Delivery fee<input id="coDelivery" type="number" min="0" step="0.01" placeholder="Leave blank if none"></label><div id="ccBox" class="paymentBox" style="display:none"><h3>Credit Card Payment</h3><div class="hint">Choose whether the 3% card fee applies to the whole amount or only the amount charged to the card.</div><label>Credit Card charge<select id="coCoverage"><option value="Full">Full amount</option><option value="Partial">Partial amount</option></select></label><label id="ccAmountWrap" style="display:none">Amount charged to card<input id="coCardAmount" type="number" min="0" step="0.01" placeholder="Enter card amount"></label></div></div><div id="coSummary" class="paySummary"></div><p id="coMsg" class="error"></p><button id="coSave" class="primary wide modalStickyAction">Complete Sale</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();

const calcCard=()=>{const delivery=Math.max(0,Number(coDelivery.value)||0),base=subtotal+delivery,isCC=coPayment.value==='Credit Card';ccBox.style.display=isCC?'block':'none';if(!isCC){coSummary.innerHTML=`<div class="summaryRow"><span>Amount due</span><strong>${money(base)}</strong></div><div class="summaryRow totalLine"><span>Final total</span><strong>${money(base)}</strong></div>`;return{delivery,base,cardAmount:0,noFeeAmount:base,cardFee:0,total:base}}const partial=coCoverage.value==='Partial';ccAmountWrap.style.display=partial?'block':'none';let cardAmount;if(partial){coCardAmount.readOnly=false;cardAmount=Math.max(0,Math.min(base,Number(coCardAmount.value)||0));if(Number(coCardAmount.value)>base)coCardAmount.value=base.toFixed(2)}else{cardAmount=base;coCardAmount.value=base.toFixed(2)}const noFeeAmount=Math.max(0,base-cardAmount),cardFee=Math.round(cardAmount*3)/100,total=base+cardFee;coSummary.innerHTML=partial?`<div class="summaryRow"><span>Amount due before card fee</span><strong>${money(base)}</strong></div><div class="summaryRow"><span>Amount charged to card</span><strong>${money(cardAmount)}</strong></div><div class="summaryRow"><span>Other payment amount</span><strong>${money(noFeeAmount)}</strong></div><div class="summaryRow"><span>Credit Card fee (3%)</span><strong>${money(cardFee)}</strong></div><div class="summaryRow totalLine"><span>Final total</span><strong>${money(total)}</strong></div>`:`<div class="summaryRow"><span>Amount due before card fee</span><strong>${money(base)}</strong></div><div class="summaryRow"><span>Credit Card fee (3%)</span><strong>${money(cardFee)}</strong></div><div class="summaryRow totalLine"><span>Final total</span><strong>${money(total)}</strong></div>`;return{delivery,base,cardAmount,noFeeAmount,cardFee,total}};

coPayment.onchange=()=>{if(coPayment.value==='Credit Card'){coCoverage.value='Full';coCardAmount.value=''}calcCard()};coCoverage.onchange=()=>{if(coCoverage.value==='Partial')coCardAmount.value='';calcCard()};coDelivery.oninput=calcCard;coCardAmount.oninput=calcCard;calcCard();

coSave.onclick=async()=>{const vals=[coName,coContact,coAddress,coBarangay,coCity,coProvince,coZip];if(vals.some(x=>!x.value.trim())){coMsg.textContent='Please complete the customer name, contact number, and all address fields.';return}const pay=calcCard();if(coPayment.value==='Credit Card'&&coCoverage.value==='Partial'&&pay.cardAmount<=0){coMsg.textContent='Enter the amount that will be charged to the Credit Card.';return}coSave.disabled=true;coSave.textContent='Saving sale…';const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_create_sale_split_local',{p_token:tok,p_customer_name:coName.value.trim(),p_contact_number:coContact.value.trim(),p_address_line:coAddress.value.trim(),p_barangay:coBarangay.value.trim(),p_city:coCity.value.trim(),p_province:coProvince.value.trim(),p_zip_code:coZip.value.trim(),p_payment_method:coPayment.value,p_delivery_fee:pay.delivery,p_credit_card_amount:pay.cardAmount,p_items:S.cart.map(x=>({id:x.id,qty:x.qty}))});if(error||!data?.ok){coMsg.textContent=data?.error||error?.message||'Unable to complete sale.';coSave.disabled=false;coSave.textContent='Complete Sale';return}S.cart=[];m.remove();await businessData();toast(`Sale #${data.sale_id} completed.`);render()}}

function editSaleModal(id){if(S.profile?.app_role!=='Admin')return;const x=S.sales.find(s=>Number(s.id)===id);if(!x)return;const methods=['Cash','E-Wallet','Online Banking','Credit Card'],baseAtOpen=Number(x.subtotal||0)+Number(x.delivery_fee||0),wasPartial=x.payment_method==='Credit Card'&&Number(x.non_card_amount||0)>0;const m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Edit Sale #${id}</h2><button class="close">×</button></div><div class="hint">Product items are preserved. Customer and payment details can be corrected here.</div><div class="formGrid"><label class="full">Customer name<input id="esName" value="${esc(x.customer_name)}"></label><label>Contact number<input id="esContact" value="${esc(x.contact_number)}"></label><label>ZIP code<input id="esZip" value="${esc(x.zip_code)}"></label><label class="full">Home No. / Street / Subdivision<input id="esAddress" value="${esc(x.address_line)}"></label><label>Barangay<input id="esBarangay" value="${esc(x.barangay)}"></label><label>City<input id="esCity" value="${esc(x.city)}"></label><label>Province<input id="esProvince" value="${esc(x.province)}"></label><label>Payment method<select id="esPayment">${methods.map(v=>`<option ${v===x.payment_method?'selected':''}>${v}</option>`).join('')}</select></label><label>Delivery fee<input id="esDelivery" type="number" min="0" step="0.01" value="${x.delivery_fee||''}"></label><div id="esCcBox" class="paymentBox" style="display:none"><h3>Credit Card Payment</h3><div class="hint">Choose whether the 3% card fee applies to the whole amount or only the amount charged to the card.</div><label>Credit Card charge<select id="esCoverage"><option value="Full" ${!wasPartial?'selected':''}>Full amount</option><option value="Partial" ${wasPartial?'selected':''}>Partial amount</option></select></label><label id="esCardAmountWrap" style="display:none">Amount charged to card<input id="esCardAmount" type="number" min="0" step="0.01" value="${x.payment_method==='Credit Card'?(x.credit_card_amount||baseAtOpen):''}"></label></div></div><div id="esSummary" class="paySummary"></div><p id="esMsg" class="error"></p><button id="esSave" class="primary wide modalStickyAction">Save Changes</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();

const calcEditCard=()=>{const delivery=Math.max(0,Number(esDelivery.value)||0),base=Number(x.subtotal||0)+delivery,isCC=esPayment.value==='Credit Card';esCcBox.style.display=isCC?'block':'none';if(!isCC){esSummary.innerHTML=`<div class="summaryRow"><span>Amount due</span><strong>${money(base)}</strong></div><div class="summaryRow totalLine"><span>Final total</span><strong>${money(base)}</strong></div>`;return{delivery,base,cardAmount:0,noFeeAmount:base,cardFee:0,total:base}}const partial=esCoverage.value==='Partial';esCardAmountWrap.style.display=partial?'block':'none';let cardAmount;if(partial){esCardAmount.readOnly=false;cardAmount=Math.max(0,Math.min(base,Number(esCardAmount.value)||0));if(Number(esCardAmount.value)>base)esCardAmount.value=base.toFixed(2)}else{cardAmount=base;esCardAmount.value=base.toFixed(2)}const noFeeAmount=Math.max(0,base-cardAmount),cardFee=Math.round(cardAmount*3)/100,total=base+cardFee;esSummary.innerHTML=partial?`<div class="summaryRow"><span>Amount due before card fee</span><strong>${money(base)}</strong></div><div class="summaryRow"><span>Amount charged to card</span><strong>${money(cardAmount)}</strong></div><div class="summaryRow"><span>Other payment amount</span><strong>${money(noFeeAmount)}</strong></div><div class="summaryRow"><span>Credit Card fee (3%)</span><strong>${money(cardFee)}</strong></div><div class="summaryRow totalLine"><span>Final total</span><strong>${money(total)}</strong></div>`:`<div class="summaryRow"><span>Amount due before card fee</span><strong>${money(base)}</strong></div><div class="summaryRow"><span>Credit Card fee (3%)</span><strong>${money(cardFee)}</strong></div><div class="summaryRow totalLine"><span>Final total</span><strong>${money(total)}</strong></div>`;return{delivery,base,cardAmount,noFeeAmount,cardFee,total}};

esPayment.onchange=()=>{if(esPayment.value==='Credit Card'&&Number(esCardAmount.value||0)<=0)esCoverage.value='Full';calcEditCard()};esCoverage.onchange=()=>{if(esCoverage.value==='Partial'&&!wasPartial)esCardAmount.value='';calcEditCard()};esDelivery.oninput=calcEditCard;esCardAmount.oninput=calcEditCard;calcEditCard();

esSave.onclick=async()=>{const pay=calcEditCard();if(esPayment.value==='Credit Card'&&esCoverage.value==='Partial'&&pay.cardAmount<=0){esMsg.textContent='Enter the amount that will be charged to the Credit Card.';return}esSave.disabled=true;const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_update_sale_split_local',{p_token:tok,p_sale_id:id,p_customer_name:esName.value.trim(),p_contact_number:esContact.value.trim(),p_address_line:esAddress.value.trim(),p_barangay:esBarangay.value.trim(),p_city:esCity.value.trim(),p_province:esProvince.value.trim(),p_zip_code:esZip.value.trim(),p_payment_method:esPayment.value,p_delivery_fee:pay.delivery,p_credit_card_amount:pay.cardAmount});if(error||!data?.ok){esMsg.textContent=data?.error||error?.message||'Unable to update sale.';esSave.disabled=false;return}m.remove();await businessData();toast('Sale updated.');render()}}
async function deleteSale(id){if(S.profile?.app_role==='Admin'){if(!confirm(`Delete sale #${id}?`))return;return runDeleteSale(id,null)}const m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Admin Approval Required</h2><button class="close">×</button></div><div class="welcome">Staff deletion of sale #${id} requires the separate Admin Action Password.</div><label>Admin Action Password<input id="dap" type="password"></label><p id="dam" class="error"></p><button id="daGo" class="danger wide">Delete Sale</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();daGo.onclick=async()=>{daGo.disabled=true;const ok=await runDeleteSale(id,dap.value,dam);if(ok)m.remove();else daGo.disabled=false}}
async function runDeleteSale(id,password,msgEl){const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_delete_sale_local',{p_token:tok,p_sale_id:id,p_action_password:password});if(error||!data?.ok){const msg=data?.error||error?.message||'Unable to delete sale.';if(msgEl)msgEl.textContent=msg;else toast(msg);return false}await businessData();toast(`Sale #${id} deleted.`);render();return true}
function bindCustomerActions(){document.querySelectorAll('[data-edit-customer]').forEach(b=>b.onclick=()=>editCustomerModal(b.dataset.editCustomer));document.querySelectorAll('[data-delete-customer]').forEach(b=>b.onclick=()=>deleteCustomer(b.dataset.deleteCustomer))}
function editCustomerModal(id){if(S.profile?.app_role!=='Admin')return;const x=S.customers.find(c=>c.id===id);if(!x)return;const m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Edit Customer</h2><button class="close">×</button></div><div class="formGrid"><label class="full">Customer name<input id="ecName" value="${esc(x.full_name)}"></label><label>Contact number<input id="ecContact" value="${esc(x.contact_number)}"></label><label>ZIP code<input id="ecZip" value="${esc(x.zip_code)}"></label><label class="full">Home No. / Street / Subdivision<input id="ecAddress" value="${esc(x.address_line)}"></label><label>Barangay<input id="ecBarangay" value="${esc(x.barangay)}"></label><label>City<input id="ecCity" value="${esc(x.city)}"></label><label>Province<input id="ecProvince" value="${esc(x.province)}"></label></div><p id="ecMsg" class="error"></p><button id="ecSave" class="primary wide">Save Customer</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();ecSave.onclick=async()=>{ecSave.disabled=true;const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_update_customer_local',{p_token:tok,p_customer_id:id,p_full_name:ecName.value.trim(),p_contact_number:ecContact.value.trim(),p_address_line:ecAddress.value.trim(),p_barangay:ecBarangay.value.trim(),p_city:ecCity.value.trim(),p_province:ecProvince.value.trim(),p_zip_code:ecZip.value.trim()});if(error||!data?.ok){ecMsg.textContent=data?.error||error?.message||'Unable to update customer.';ecSave.disabled=false;return}m.remove();await loadCustomers();toast('Customer updated.');render()}}
async function deleteCustomer(id){if(S.profile?.app_role!=='Admin')return;const x=S.customers.find(c=>c.id===id);if(!confirm(`Delete customer ${x?.full_name||''}? Existing sales will keep their customer snapshot.`))return;const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_delete_customer_local',{p_token:tok,p_customer_id:id});if(error||!data?.ok){toast(data?.error||error?.message||'Unable to delete customer.');return}await loadCustomers();toast('Customer deleted.');render()}
function setActionPassword(){const m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>${S.actionPasswordInfo?.configured?'Change':'Set'} Admin Action Password</h2><button class="close">×</button></div><div class="welcome">This is separate from your Admin login password. Staff will need it only to delete protected order entries.</div><label>Your current Admin login password<input id="apLogin" type="password"></label><label>New Admin Action Password<input id="ap1" type="password" minlength="8"></label><label>Confirm Action Password<input id="ap2" type="password" minlength="8"></label><p id="apMsg" class="error"></p><button id="apSave" class="primary wide">Save Action Password</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();apSave.onclick=async()=>{if(ap1.value.length<8){apMsg.textContent='Use at least 8 characters.';return}if(ap1.value!==ap2.value){apMsg.textContent='Passwords do not match.';return}apSave.disabled=true;const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_set_action_password_local',{p_token:tok,p_login_password:apLogin.value,p_new_action_password:ap1.value});if(error||!data?.ok){apMsg.textContent=data?.error||error?.message||'Unable to save action password.';apSave.disabled=false;return}m.remove();await actionPasswordInfo();toast('Admin Action Password saved.');staffView()}}
async function staffView(){const c=document.getElementById('content');try{await staff();await actionPasswordInfo()}catch(e){c.innerHTML=`<h2>Accounts</h2><div class="light" style="padding:18px"><p class="error">${esc(e.message)}</p></div>`;return}const pending=S.staffs.filter(s=>s.status==='Pending').length,active=S.staffs.filter(s=>s.status==='Active').length,disabled=S.staffs.filter(s=>s.status==='Disabled').length,staffPage=pageSlice(S.staffs,'Accounts');c.innerHTML=`<h2>Accounts</h2><div class="light"><div class="toolbar"><div><b>Admin & Staff Accounts</b><div class="hint">Manage Admin and Staff accounts, approvals, roles, and access here.</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="copyReg" class="secondary">Copy Registration Link</button><button id="changeMine" class="primary">Change My Password</button><button id="actionPass" class="secondary">${S.actionPasswordInfo?.configured?'Change Admin Action Password':'Set Admin Action Password'}</button><button id="refreshStaff" class="secondary">↻ Refresh</button></div></div><div class="settingsBox"><b>Admin Action Password</b><span class="hint">${S.actionPasswordInfo?.configured?'Configured. Staff can use this separate password only when an order/entry must be deleted.':'Not configured yet. Set a password different from your Admin login password.'}</span></div><div class="staffSummary"><div class="staffStat">Active<b>${active}</b></div><div class="staffStat">Pending<b>${pending}</b></div><div class="staffStat">Disabled<b>${disabled}</b></div></div><div class="tableWrap"><table class="tbl"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Registered</th><th>Last Login</th><th>Actions</th></tr></thead><tbody>${staffPage.map(s=>{const self=s.id===S.profile.id;return `<tr class="${s.status==='Disabled'?'disabled':''}"><td>${esc(s.full_name)}${self?' <span class="muted">(You)</span>':''}</td><td><b>${esc(s.username)}</b></td><td>${self?esc(s.app_role):`<select data-role="${s.id}"><option ${s.app_role==='Staff'?'selected':''}>Staff</option><option ${s.app_role==='Admin'?'selected':''}>Admin</option></select>`}</td><td class="${s.status==='Active'?'active':s.status==='Pending'?'pending':''}">${esc(s.status)}</td><td>${s.created_at?new Date(s.created_at).toLocaleString('en-PH',{timeZone:'Asia/Manila'}):'—'}</td><td>${s.last_login_at?new Date(s.last_login_at).toLocaleString('en-PH',{timeZone:'Asia/Manila'}):'Never'}</td><td>${self?`<button data-reset="${s.id}" class="secondary">Reset Password</button>`:`${s.status==='Pending'?`<button data-status="${s.id}" data-next="Active" class="success">Approve</button>`:s.status==='Active'?`<button data-status="${s.id}" data-next="Disabled" class="danger">Disable</button>`:`<button data-status="${s.id}" data-next="Active" class="success">Enable</button>`} <button data-reset="${s.id}" class="secondary">Reset Password</button> <button data-delete="${s.id}" class="danger">Delete</button>`}</td></tr>`}).join('')}</tbody></table></div>${pager(S.staffs,'Accounts')}</div>`;bindPager();document.getElementById('refreshStaff').onclick=staffView;document.getElementById('copyReg').onclick=async()=>{const u=`${location.origin}/register`;try{await navigator.clipboard.writeText(u);toast('Registration link copied.')}catch{prompt('Copy this registration link:',u)}};document.getElementById('changeMine').onclick=changeMyPassword;document.getElementById('actionPass').onclick=setActionPassword;document.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_update_staff_local',{p_token:tok,p_account_id:b.dataset.status,p_status:b.dataset.next,p_role:null});if(error||!data?.ok)toast(data?.error||error?.message||'Unable to update account.');else{toast(`Account ${b.dataset.next.toLowerCase()}.`);staffView()}});document.querySelectorAll('[data-role]').forEach(sel=>sel.onchange=async()=>{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_update_staff_local',{p_token:tok,p_account_id:sel.dataset.role,p_status:null,p_role:sel.value});if(error||!data?.ok){toast(data?.error||error?.message||'Unable to update role.');staffView()}else toast('Role updated.')});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const who=S.staffs.find(x=>x.id===b.dataset.delete);if(!confirm(`Delete ${who?.full_name||'this account'}?`))return;const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_delete_staff_local',{p_token:tok,p_account_id:b.dataset.delete});if(error||!data?.ok)toast(data?.error||error?.message||'Unable to delete account.');else{toast('Account deleted.');staffView()}});document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>resetStaffPassword(b.dataset.reset))}
function resetStaffPassword(accountId){const who=S.staffs.find(x=>x.id===accountId),m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Reset Password</h2><button class="close">×</button></div><div class="welcome">Set a new password for <b>${esc(who?.full_name||'this account')}</b> (${esc(who?.username||'')}).</div><label>New password<input id="np1" type="password" minlength="8"></label><label>Confirm password<input id="np2" type="password" minlength="8"></label><p id="npm" class="error"></p><button id="saveNp" class="primary wide">Save New Password</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();document.getElementById('saveNp').onclick=async()=>{if(np1.value.length<8){npm.textContent='Password must be at least 8 characters.';return}if(np1.value!==np2.value){npm.textContent='Passwords do not match.';return}saveNp.disabled=true;saveNp.textContent='Saving…';const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_admin_set_password_local',{p_token:tok,p_account_id:accountId,p_new_password:np1.value});if(error||!data?.ok){npm.textContent=data?.error||error?.message||'Unable to reset password.';saveNp.disabled=false;saveNp.textContent='Save New Password';return}m.remove();if(accountId===S.profile.id){localStorage.removeItem(TOKEN_KEY);loginView('Password changed. Please log in again with your new password.')}else toast('Password reset.')}}
function changeMyPassword(){const m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Change My Password</h2><button class="close">×</button></div><label>Current password<input id="cp" type="password"></label><label>New password<input id="cn1" type="password" minlength="8"></label><label>Confirm new password<input id="cn2" type="password" minlength="8"></label><p id="cpm" class="error"></p><button id="saveCp" class="primary wide">Change Password</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();document.getElementById('saveCp').onclick=async()=>{if(cn1.value.length<8){cpm.textContent='New password must be at least 8 characters.';return}if(cn1.value!==cn2.value){cpm.textContent='Passwords do not match.';return}saveCp.disabled=true;saveCp.textContent='Saving…';const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_change_password_local',{p_token:tok,p_current_password:cp.value,p_new_password:cn1.value});if(error||!data?.ok){cpm.textContent=data?.error||error?.message||'Unable to change password.';saveCp.disabled=false;saveCp.textContent='Change Password';return}m.remove();toast('Password changed successfully.')}}
