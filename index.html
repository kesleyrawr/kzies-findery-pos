function stockState(p){
  if(!p.stock_tracked)return{key:'Not Set',cls:'unset',label:'Not Set'};
  if(p.stock_qty<=0)return{key:'Out of Stock',cls:'out',label:'Out of Stock'};
  if(p.stock_qty<=5)return{key:'Low Stock',cls:'low',label:'Low Stock'};
  return{key:'In Stock',cls:'ok',label:'In Stock'};
}
function stockBadge(p){const s=stockState(p);return '<span class="stockBadge '+s.cls+'"><span class="stockDot"></span>'+s.label+'</span>'}
function sortProducts(list){
  const x=[...list],k=S.productSort||'name-asc';
  x.sort((a,b)=>{
    if(k==='name-asc')return a.name.localeCompare(b.name);
    if(k==='name-desc')return b.name.localeCompare(a.name);
    if(k==='price-high')return Number(b.selling||0)-Number(a.selling||0);
    if(k==='price-low')return Number(a.selling||0)-Number(b.selling||0);
    if(k==='qty-high')return Number(b.stock_qty||0)-Number(a.stock_qty||0);
    if(k==='qty-low')return Number(a.stock_qty||0)-Number(b.stock_qty||0);
    return 0;
  });
  return x;
}
function stockFilterPass(p){
  const f=S.productStockFilter||'All',s=stockState(p).key;
  if(f==='All')return true;
  if(f==='In Stock')return p.stock_tracked&&p.stock_qty>0;
  return s===f;
}

function enhanceTables(root=document){
  root.querySelectorAll('table.tbl').forEach(table=>{
    if(table.dataset.sortEnhanced==='1')return;
    table.dataset.sortEnhanced='1';
    const ths=[...table.querySelectorAll('thead th')],tbody=table.querySelector('tbody');
    if(!tbody)return;
    ths.forEach((th,idx)=>{
      const label=th.textContent.trim();
      if(!label||/^actions?$/i.test(label))return;
      th.classList.add('sortFilterHead');
      th.innerHTML='';
      const btn=document.createElement('button');btn.type='button';btn.className='thSortBtn';btn.textContent=label+' ↕';btn.dataset.dir='none';
      btn.onclick=()=>{
        const rows=[...tbody.rows],asc=btn.dataset.dir!=='asc';
        ths.forEach(x=>{const b=x.querySelector('.thSortBtn');if(b&&b!==btn){b.dataset.dir='none';b.textContent=b.textContent.replace(/ [▲▼]$/,'').replace(/ ↕$/,'')+' ↕'}});
        const val=row=>{
          const s=String(row.cells[idx]?.innerText||'').trim();
          const num=Number(s.replace(/[₱,#,%]/g,'').replace(/,/g,'').replace(/[^0-9.+-]/g,''));
          if(s && !Number.isNaN(num) && /[0-9]/.test(s))return {t:'n',v:num};
          const d=Date.parse(s);if(!Number.isNaN(d)&&(/[\/:-]/.test(s)||/[A-Za-z]{3}/.test(s)))return {t:'n',v:d};
          return {t:'s',v:s.toLowerCase()};
        };
        rows.sort((a,b)=>{const A=val(a),B=val(b);let z=A.t==='n'&&B.t==='n'?A.v-B.v:String(A.v).localeCompare(String(B.v));return asc?z:-z});
        rows.forEach(r=>tbody.appendChild(r));btn.dataset.dir=asc?'asc':'desc';btn.textContent=label+(asc?' ▲':' ▼');
      };
      th.append(btn);
    });
  });
}

async function profile(){const tok=localStorage.getItem(TOKEN_KEY)||'';if(!tok)return false;const {data,error}=await sb.rpc('kzies_session_local',{p_token:tok});if(error||!data?.ok){localStorage.removeItem(TOKEN_KEY);S.profile=null;return false}S.profile=data.profile;return true}
async function logoutLocal(){const tok=localStorage.getItem(TOKEN_KEY)||'';try{if(tok)await sb.rpc('kzies_logout_local',{p_token:tok})}catch{}clearInterval(backupTimer);backupTimer=null;localStorage.removeItem(TOKEN_KEY);S.profile=null;S.tab='POS';loginView()}
async function products(){
 try{
  const tok=localStorage.getItem(TOKEN_KEY)||'';
  const {data,error}=await sb.rpc('kzies_get_products_local',{p_token:tok});
  if(error||!data?.ok) throw new Error(data?.error||error?.message||'Unable to load products.');
  const rows=Array.isArray(data.products)?data.products:[];
  S.products=rows.map((x,i)=>{const retail=x.retail==null?null:Number(x.retail),wholesale=x.wholesale==null?null:Number(x.wholesale),selling=retail?Math.round(retail*1.3):null;return{id:x.id??i+1,brand:x.brand||'',name:x.name||'',retail,wholesale,notes:x.notes||'',category:x.category||'',selling,income:selling!=null&&wholesale!=null?selling-wholesale:null,stock_tracked:!!x.stock_tracked,stock_qty:Number(x.stock_qty||0),stock_in:Number(x.stock_in||0),stock_out:Number(x.stock_out||0),average_cost:Number(x.average_cost||0),inventory_value:Number(x.inventory_value||0),stock_purchase_cost:Number(x.stock_purchase_cost||0)}}).filter(x=>x.name);
  if(!S.products.length) throw new Error('No products are available yet.');scheduleAutoBackupSoon();
 }catch(e){console.error('Unable to load products',e);S.products=[]}
}
async function businessData(){await Promise.all([loadSales(),loadCustomers(),loadRefunds(),loadWarranties(),loadCalendar()]);scheduleAutoBackupSoon()}
async function loadRefunds(){try{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_list_refunds_local',{p_token:tok});if(error||!data?.ok)throw new Error(data?.error||error?.message);S.refunds=(data.refunds||[]).map(x=>({...x,quantity:Number(x.quantity||0),refund_amount:Number(x.refund_amount||0)}))}catch(e){console.error('Unable to load refunds',e);S.refunds=[]}}
async function loadWarranties(){try{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_list_warranties_local',{p_token:tok});if(error||!data?.ok)throw new Error(data?.error||error?.message);S.warranties=(data.warranties||[]).map(x=>({...x,quantity:Number(x.quantity||0)}))}catch(e){console.error('Unable to load warranties',e);S.warranties=[]}}
async function loadCalendar(){try{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_list_calendar_local',{p_token:tok});if(error||!data?.ok)throw new Error(data?.error||error?.message);S.events=(data.events||[]).map(x=>({...x,quote_total:Number(x.quote_total||0)}))}catch(e){console.error('Unable to load calendar',e);S.events=[]}}
async function loadSales(){try{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_list_sales_local',{p_token:tok});if(error||!data?.ok)throw new Error(data?.error||error?.message);S.sales=(data.sales||[]).map(x=>({...x,subtotal:Number(x.subtotal||0),delivery_fee:Number(x.delivery_fee||0),payment_fee:Number(x.payment_fee||0),credit_card_amount:Number(x.credit_card_amount||0),non_card_amount:Number(x.non_card_amount||0),total:Number(x.total||0),wholesale_total:Number(x.wholesale_total||0),income:Number(x.income||0)}))}catch(e){console.error('Unable to load sales',e);S.sales=[]}}
async function loadCustomers(){try{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_list_customers_local',{p_token:tok});if(error||!data?.ok)throw new Error(data?.error||error?.message);S.customers=data.customers||[]}catch(e){console.error('Unable to load customers',e);S.customers=[]}}
async function actionPasswordInfo(){try{const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_action_password_info_local',{p_token:tok});if(error||!data?.ok)throw new Error(data?.error||error?.message);S.actionPasswordInfo=data}catch(e){S.actionPasswordInfo={configured:false}}}
async function staff(){const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_list_staff_local',{p_token:tok});if(error||!data?.ok){S.staffs=[];throw new Error(data?.error||error?.message||'Unable to load staff accounts.')}S.staffs=data.staff||[];S.invites=[]}
function clock(){const d=new Date();return `<div class="clock"><b>${d.toLocaleDateString('en-PH',{timeZone:'Asia/Manila',weekday:'short',month:'short',day:'numeric',year:'numeric'})}</b><span>${d.toLocaleTimeString('en-PH',{timeZone:'Asia/Manila',hour:'numeric',minute:'2-digit',second:'2-digit'})} • PH Time</span></div>`}
function backupStatusHtml(){
  const raw=localStorage.getItem('kzies_backup_last_saved');
  if(!raw)return '<div class="backupChip none"><b>Latest Backup</b><span>No backup yet</span></div>';
  const d=new Date(raw);
  if(Number.isNaN(d.getTime()))return '<div class="backupChip none"><b>Latest Backup</b><span>No backup yet</span></div>';
  return '<div class="backupChip"><b>✓ Latest Backup</b><span>'+d.toLocaleString('en-PH',{timeZone:'Asia/Manila',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</span></div>';
}
function refreshBackupStatusHeader(){const el=document.getElementById('backupStatus');if(el)el.innerHTML=backupStatusHtml()}
function markBackupSaved(){backupLastSaved=new Date();localStorage.setItem('kzies_backup_last_saved',backupLastSaved.toISOString());refreshBackupStatusHeader()}
async function loadInvoiceInfo(){
  if(S.profile?.app_role!=='Admin')return;
  const tok=localStorage.getItem(TOKEN_KEY)||'';
  const {data,error}=await sb.rpc('kzies_invoice_info_local',{p_token:tok});
  if(error||!data?.ok)throw new Error(data?.error||error?.message||'Unable to load invoice counter.');
  S.invoiceInfo={current_number:Number(data.current_number||0),total_invoices:Number(data.total_invoices||0),latest_invoice:data.latest_invoice||'—'};
}
async function resetInvoiceCounter(){
  if(S.profile?.app_role!=='Admin')return;
  if(!confirm('Reset the invoice counter to 0? Existing sales and their old invoice numbers will stay unchanged. The next new invoice will be KZF-INV-000001.'))return;
  const tok=localStorage.getItem(TOKEN_KEY)||'';
  const {data,error}=await sb.rpc('kzies_reset_invoice_counter_local',{p_token:tok});
  if(error||!data?.ok){toast(data?.error||error?.message||'Unable to reset invoice counter.');return}
  await loadInvoiceInfo();toast('Invoice counter reset to 0.');staffView();
}

function cards(list,adminActions=false){return '<div class="grid">'+list.map(p=>'<article class="product"><div class="thumb">⌨️</div><div class="body"><div class="brandName">'+esc(p.brand)+'</div><h3>'+esc(p.name)+'</h3><div class="price">'+(p.selling?money(p.selling):'Contact us')+'</div><div class="cost">Retail: '+(p.retail?money(p.retail):'Contact us')+'<br>Wholesale: '+(p.wholesale?money(p.wholesale):'Contact us')+'</div>'+(p.income!=null?'<div class="income">Income: '+money(p.income)+'</div>':'')+'<div style="margin-top:7px">'+stockBadge(p)+' '+(p.stock_tracked?'<span class="hint">Qty: '+p.stock_qty+'</span>':'')+'</div><button data-add="'+p.id+'" '+(!p.selling||(p.stock_tracked&&p.stock_qty<=0)?'disabled':'')+'>Add to cart</button>'+(adminActions&&S.profile?.app_role==='Admin'?'<div class="productActions"><button class="secondary" data-edit-product="'+p.id+'">Edit</button><button class="danger" data-delete-product="'+p.id+'">Delete</button></div>':'')+'</div></article>').join('')+'</div>'}
function bindAdd(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=S.products.find(x=>x.id==b.dataset.add);if(!p){toast('Product not found. Please refresh.');return}const q=S.cart.find(x=>x.id===p.id),next=(q?.qty||0)+1;if(p.stock_tracked&&next>p.stock_qty){toast('Only '+p.stock_qty+' in stock for '+p.name+'.');return}rememberRecent([p]);q?q.qty++:S.cart.push({...p,qty:1});if(S.tab==='POS'){render()}else{const oldText=b.textContent;b.textContent='Added ✓';b.disabled=true;toast(p.name+' added to cart.');setTimeout(()=>{if(document.body.contains(b)){b.textContent=oldText;b.disabled=false}},700)}})}
function bindProductAdminActions(){document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>editProductModal(Number(b.dataset.editProduct)));document.querySelectorAll('[data-delete-product]').forEach(b=>b.onclick=()=>deleteProduct(Number(b.dataset.deleteProduct)));document.querySelectorAll('[data-stock-product]').forEach(b=>b.onclick=()=>stockModal(Number(b.dataset.stockProduct)));document.querySelectorAll('[data-stock-history]').forEach(b=>b.onclick=()=>stockHistoryModal(Number(b.dataset.stockHistory)))}
async function deleteProduct(id){if(S.profile?.app_role!=='Admin')return;const p=S.products.find(x=>x.id===id);if(!confirm(`Delete ${p?.name||'this product'} from Kzie’s product list?`))return;const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_delete_product_local',{p_token:tok,p_product_id:id});if(error||!data?.ok){toast(data?.error||error?.message||'Unable to delete product.');return}await products();toast('Product deleted.');shell()}
function editProductModal(id){const p=S.products.find(x=>x.id===id);if(!p||S.profile?.app_role!=='Admin')return;const cats=['Keyboards','Mice','Headsets','Mouse Pads','Cooling & Fans','Thermal Paste','Accessories','Other'];const current=p.category||categoryOf(p);const m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Edit Product</h2><button class="close">×</button></div><div class="formGrid"><label>Brand<input id="epBrand" value="${esc(p.brand)}"></label><label>Category<select id="epCat">${cats.map(x=>`<option ${x===current?'selected':''}>${x}</option>`).join('')}</select></label><label class="full">Product name<input id="epName" value="${esc(p.name)}"></label><label>Retail price<input id="epRetail" type="number" min="0" step="0.01" value="${p.retail??''}"></label><label>Wholesale price<input id="epWholesale" type="number" min="0" step="0.01" value="${p.wholesale??''}"></label><label class="full">Notes<input id="epNotes" value="${esc(p.notes||'')}"></label></div><p id="epMsg" class="error"></p><button id="epSave" class="primary wide">Save Product</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();epSave.onclick=async()=>{if(!epName.value.trim()){epMsg.textContent='Product name is required.';return}epSave.disabled=true;epSave.textContent='Saving…';const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_update_product_local',{p_token:tok,p_product_id:id,p_brand:epBrand.value.trim(),p_name:epName.value.trim(),p_retail:epRetail.value===''?null:Number(epRetail.value),p_wholesale:epWholesale.value===''?null:Number(epWholesale.value),p_notes:epNotes.value.trim(),p_category:epCat.value});if(error||!data?.ok){epMsg.textContent=data?.error||error?.message||'Unable to save product.';epSave.disabled=false;epSave.textContent='Save Product';return}m.remove();await products();toast('Product updated.');shell()}}


function stockModal(id){
  const p=S.products.find(x=>x.id===id);if(!p||S.profile?.app_role!=='Admin')return;
  const m=document.createElement('div');m.className='modalBg';
  m.innerHTML='<div class="modal"><div class="modalHead"><h2>Stock • '+esc(p.name)+'</h2><button class="close">×</button></div><div class="welcome">Current: <b>'+(p.stock_tracked?p.stock_qty+' pcs':'Not set')+'</b> • Incoming: '+p.stock_in+' • Out: '+p.stock_out+'</div><div class="formGrid"><label>Action<select id="stAction">'+(p.stock_tracked?'<option value="IN">Stock In / Incoming</option><option value="OUT">Stock Out</option><option value="SET">Correct Exact Qty</option>':'<option value="OPENING">Set Opening Stock</option><option value="IN">Stock In / Incoming</option><option value="SET">Set Exact Qty</option>')+'</select></label><label id="stQtyLabel">Quantity<input id="stQty" type="number" min="0" step="1" value="'+(p.stock_tracked?'1':Math.max(0,p.stock_qty))+'"></label><label id="stCostWrap">Unit Cost<input id="stCost" type="number" min="0" step="0.01" value="'+(p.wholesale??p.average_cost??0)+'"></label><label class="full">Notes<input id="stNotes" placeholder="Supplier, invoice, reason for stock out, etc."></label></div><div id="stPreview" class="paySummary"></div><div class="financeNote" style="margin-top:10px"><b>Capital connection:</b> Opening Stock and Stock In are counted as money used to purchase inventory. Stock Out and quantity corrections do not create a new capital expense.</div><p id="stMsg" class="error"></p><button id="stSave" class="primary wide modalStickyAction">Save Stock Movement</button></div>';
  document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();
  function preview(){
    const a=stAction.value,q=Math.max(0,Number(stQty.value)||0),cost=Math.max(0,Number(stCost.value)||0),isPurchase=a==='OPENING'||a==='IN';
    stCostWrap.style.display=isPurchase?'block':'none';
    stPreview.innerHTML='<div class="summaryRow"><span>'+(a==='OUT'?'Stock to remove':a==='SET'?'New exact quantity':'Stock to add')+'</span><strong>'+q+' pcs</strong></div>'+(isPurchase?'<div class="summaryRow totalLine"><span>Money used for inventory</span><strong>'+money(q*cost)+'</strong></div>':'<div class="hint">No new inventory purchase cost will be added.</div>');
  }
  stAction.onchange=preview;stQty.oninput=preview;stCost.oninput=preview;preview();
  stSave.onclick=async()=>{
    const action=stAction.value,qty=Number(stQty.value||0),cost=Number(stCost.value||0);
    if(qty<0||((action!=='SET')&&qty<=0)){stMsg.textContent='Enter a valid quantity.';return}
    stSave.disabled=true;stSave.textContent='Saving…';
    const tok=localStorage.getItem(TOKEN_KEY)||'';
    const {data,error}=await sb.rpc('kzies_stock_change_local',{p_token:tok,p_product_id:id,p_action:action,p_quantity:qty,p_unit_cost:cost,p_notes:stNotes.value.trim()});
    if(error||!data?.ok){stMsg.textContent=data?.error||error?.message||'Unable to update stock.';stSave.disabled=false;stSave.textContent='Save Stock Movement';return}
    m.remove();await products();toast('Stock updated • Qty '+data.quantity);render();
  };
}
async function stockHistoryModal(id){
  const p=S.products.find(x=>x.id===id);if(!p||S.profile?.app_role!=='Admin')return;
  const m=document.createElement('div');m.className='modalBg';m.innerHTML='<div class="modal"><div class="modalHead"><h2>Stock History • '+esc(p.name)+'</h2><button class="close">×</button></div><div id="stockHistBody" class="light" style="padding:14px">Loading…</div></div>';document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();
  const tok=localStorage.getItem(TOKEN_KEY)||'',{data,error}=await sb.rpc('kzies_stock_history_local',{p_token:tok,p_product_id:id});
  if(error||!data?.ok){stockHistBody.innerHTML='<p class="error">'+esc(data?.error||error?.message||'Unable to load stock history.')+'</p>';return}
  const rows=data.movements||[];

function phDateParts(){
  const out={};
  new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(p=>{if(p.type!=='literal')out[p.type]=Number(p.value)});
  return {year:out.year,month:out.month,day:out.day};
}
function addMonthKey(key,delta){
  const p=String(key).split('-').map(Number),d=new Date(Date.UTC(p[0],p[1]-1+delta,1));
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');
}
function firstLoanDueMonth(start,dueDay){
  const v=String(start||phToday()),p=v.split('-').map(Number),key=String(p[0]).padStart(4,'0')+'-'+String(p[1]).padStart(2,'0');
  return p[2]<=dueDay?key:addMonthKey(key,1);
}
function loanDueInfo(f){
  const monthly=Number(f.settings.monthly_payment||0),balance=Number(f.loan.balance||0),dueDay=Number(f.settings.due_day||16);
  if(monthly<=0||balance<=0)return null;
  const now=phDateParts(),current=now.year+'-'+String(now.month).padStart(2,'0'),payments=f.payments||[];
  let candidate=firstLoanDueMonth(f.settings.loan_started_at,dueDay);
  const paidFor=key=>payments.filter(p=>String(p.due_month||'').slice(0,7)===key).reduce((a,p)=>a+Number(p.amount||0),0);
  for(let guard=0;guard<240&&candidate<=current;guard++){
    const paid=paidFor(candidate),target=Math.min(monthly,Math.max(0,balance+paid));
    if(paid+0.005<target){
      const overdue=candidate<current||(candidate===current&&now.day>dueDay),today=candidate===current&&now.day===dueDay;
      const days=candidate===current?Math.max(0,dueDay-now.day):0;
      return {month:candidate,due_date:candidate+'-'+String(dueDay).padStart(2,'0'),paid:paid,target:target,remaining:Math.max(0,target-paid),overdue:overdue,today:today,label:overdue?'Overdue':today?'Due today':candidate===current?'Due in '+days+' day'+(days===1?'':'s'):'Upcoming'};
    }
    candidate=addMonthKey(candidate,1);
  }
  const paid=paidFor(candidate),target=Math.min(monthly,Math.max(0,balance+paid));
  return {month:candidate,due_date:candidate+'-'+String(dueDay).padStart(2,'0'),paid:paid,target:target,remaining:Math.max(0,target-paid),overdue:false,today:false,label:'Upcoming'};
}

function editSaleModal(id){if(S.profile?.app_role!=='Admin')return;const x=S.sales.find(s=>Number(s.id)===id);if(!x)return;const methods=['Cash','E-Wallet','Online Banking','Credit Card'],baseAtOpen=Number(x.subtotal||0)+Number(x.delivery_fee||0),wasPartial=x.payment_method==='Credit Card'&&Number(x.non_card_amount||0)>0;const m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Edit Sale #${id}</h2><button class="close">×</button></div><div class="hint">Product items are preserved. Customer and payment details can be corrected here.</div><div class="formGrid"><label class="full">Customer name<input id="esName" value="${esc(x.customer_name)}"></label><label>Contact number<input id="esContact" value="${esc(x.contact_number)}"></label><label>ZIP code<input id="esZip" value="${esc(x.zip_code)}"></label><label class="full">Home No. / Street / Subdivision<input id="esAddress" value="${esc(x.address_line)}"></label><label>Barangay<input id="esBarangay" value="${esc(x.barangay)}"></label><label>City<input id="esCity" value="${esc(x.city)}"></label><label>Province<input id="esProvince" value="${esc(x.province)}"></label><label>Payment method<select id="esPayment">${methods.map(v=>`<option ${v===x.payment_method?'selected':''}>${v}</option>`).join('')}</select></label><label>Delivery fee<input id="esDelivery" type="number" min="0" step="0.01" value="${x.delivery_fee||''}"></label><label id="esRefWrap" style="display:${x.payment_method==='Cash'?'none':'block'}">Payment reference<input id="esPaymentRef" value="${esc(x.payment_reference||'')}"></label><div id="esCcBox" class="paymentBox" style="display:none"><h3>Credit Card Payment</h3><div class="hint">Choose whether the 3% card fee applies to the whole amount or only the amount charged to the card.</div><label>Credit Card charge<select id="esCoverage"><option value="Full" ${!wasPartial?'selected':''}>Full amount</option><option value="Partial" ${wasPartial?'selected':''}>Partial amount</option></select></label><label id="esCardAmountWrap" style="display:none">Amount charged to card<input id="esCardAmount" type="number" min="0" step="0.01" value="${x.payment_method==='Credit Card'?(x.credit_card_amount||baseAtOpen):''}"></label></div></div><div id="esSummary" class="paySummary"></div><p id="esMsg" class="error"></p><button id="esSave" class="primary wide modalStickyAction">Save Changes</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();

const calcEditCard=()=>{const delivery=Math.max(0,Number(esDelivery.value)||0),base=Number(x.subtotal||0)+delivery,isCC=esPayment.value==='Credit Card';esCcBox.style.display=isCC?'block':'none';if(!isCC){esSummary.innerHTML=`<div class="summaryRow"><span>Amount due</span><strong>${money(base)}</strong></div><div class="summaryRow totalLine"><span>Final total</span><strong>${money(base)}</strong></div>`;return{delivery,base,cardAmount:0,noFeeAmount:base,cardFee:0,total:base}}const partial=esCoverage.value==='Partial';esCardAmountWrap.style.display=partial?'block':'none';let cardAmount;if(partial){esCardAmount.readOnly=false;cardAmount=Math.max(0,Math.min(base,Number(esCardAmount.value)||0));if(Number(esCardAmount.value)>base)esCardAmount.value=base.toFixed(2)}else{cardAmount=base;esCardAmount.value=base.toFixed(2)}const noFeeAmount=Math.max(0,base-cardAmount),cardFee=Math.round(cardAmount*3)/100,total=base+cardFee;esSummary.innerHTML=partial?`<div class="summaryRow"><span>Amount due before card fee</span><strong>${money(base)}</strong></div><div class="summaryRow"><span>Amount charged to card</span><strong>${money(cardAmount)}</strong></div><div class="summaryRow"><span>Other payment amount</span><strong>${money(noFeeAmount)}</strong></div><div class="summaryRow"><span>Credit Card fee (3%)</span><strong>${money(cardFee)}</strong></div><div class="summaryRow totalLine"><span>Final total</span><strong>${money(total)}</strong></div>`:`<div class="summaryRow"><span>Amount due before card fee</span><strong>${money(base)}</strong></div><div class="summaryRow"><span>Credit Card fee (3%)</span><strong>${money(cardFee)}</strong></div><div class="summaryRow totalLine"><span>Final total</span><strong>${money(total)}</strong></div>`;return{delivery,base,cardAmount,noFeeAmount,cardFee,total}};

function resetStaffPassword(accountId){const who=S.staffs.find(x=>x.id===accountId),m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Reset Password</h2><button class="close">×</button></div><div class="welcome">Set a new password for <b>${esc(who?.full_name||'this account')}</b> (${esc(who?.username||'')}).</div><label>New password<input id="np1" type="password" minlength="8"></label><label>Confirm password<input id="np2" type="password" minlength="8"></label><p id="npm" class="error"></p><button id="saveNp" class="primary wide">Save New Password</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();document.getElementById('saveNp').onclick=async()=>{if(np1.value.length<8){npm.textContent='Password must be at least 8 characters.';return}if(np1.value!==np2.value){npm.textContent='Passwords do not match.';return}saveNp.disabled=true;saveNp.textContent='Saving…';const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_admin_set_password_local',{p_token:tok,p_account_id:accountId,p_new_password:np1.value});if(error||!data?.ok){npm.textContent=data?.error||error?.message||'Unable to reset password.';saveNp.disabled=false;saveNp.textContent='Save New Password';return}m.remove();if(accountId===S.profile.id){localStorage.removeItem(TOKEN_KEY);loginView('Password changed. Please log in again with your new password.')}else toast('Password reset.')}}
function changeMyPassword(){const m=document.createElement('div');m.className='modalBg';m.innerHTML=`<div class="modal"><div class="modalHead"><h2>Change My Password</h2><button class="close">×</button></div><label>Current password<input id="cp" type="password"></label><label>New password<input id="cn1" type="password" minlength="8"></label><label>Confirm new password<input id="cn2" type="password" minlength="8"></label><p id="cpm" class="error"></p><button id="saveCp" class="primary wide">Change Password</button></div>`;document.body.append(m);m.querySelector('.close').onclick=()=>m.remove();document.getElementById('saveCp').onclick=async()=>{if(cn1.value.length<8){cpm.textContent='New password must be at least 8 characters.';return}if(cn1.value!==cn2.value){cpm.textContent='Passwords do not match.';return}saveCp.disabled=true;saveCp.textContent='Saving…';const tok=localStorage.getItem(TOKEN_KEY)||'';const {data,error}=await sb.rpc('kzies_change_password_local',{p_token:tok,p_current_password:cp.value,p_new_password:cn1.value});if(error||!data?.ok){cpm.textContent=data?.error||error?.message||'Unable to change password.';saveCp.disabled=false;saveCp.textContent='Change Password';return}m.remove();toast('Password changed successfully.')}}
